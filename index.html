<style>
/* Soft UI (neumorphism): surfaces share the page colour and are lifted or pressed with paired light/dark shadows; one deep-teal accent */
:root{
  --bg:#ece5da; --surface:#ece5da; --sunk:#e3dbcf; --line:#d6ccbd;
  --ink:#1f2a2b; --muted:#6e6a62;
  --accent:#0f5257; --accent-ink:#ffffff; --accent-soft:#dfe6e1;
  --money:#8f5f14; --money-soft:#e7dccb;
  --p:#2c7a5c; --c:#b07f12; --f:#b2474f; --kcal:#bf5f26;
  --danger:#b2363f;
  --hi:rgba(255,255,255,.85); --lo:rgba(163,146,120,.55);
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r:18px;
  color-scheme: only light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#252a2c; --surface:#252a2c; --sunk:#1f2325; --line:#343a3d;
  --ink:#e9e6df; --muted:#a19d94;
  --accent:#5fb8b2; --accent-ink:#10292a; --accent-soft:#2c3537;
  --money:#e2b25a; --money-soft:#2e2b24;
  --p:#5fc79a; --c:#e0b448; --f:#ec7a82; --kcal:#ee9356; --danger:#ef7b82;
  --hi:rgba(255,255,255,.06); --lo:rgba(0,0,0,.55);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#252a2c; --surface:#252a2c; --sunk:#1f2325; --line:#343a3d;
  --ink:#e9e6df; --muted:#a19d94;
  --accent:#5fb8b2; --accent-ink:#10292a; --accent-soft:#2c3537;
  --money:#e2b25a; --money-soft:#2e2b24;
  --p:#5fc79a; --c:#e0b448; --f:#ec7a82; --kcal:#ee9356; --danger:#ef7b82;
  --hi:rgba(255,255,255,.06); --lo:rgba(0,0,0,.55);
  color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;padding-top:env(safe-area-inset-top,0px)}
#installBtn[hidden]{display:none}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 80px}
.wrap{max-width:960px;margin:0 auto}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:18px 10px}
.brand h1{font-size:26px;font-weight:800;letter-spacing:-.02em}
.brand p{margin:0;color:var(--muted);font-size:13px}
.who{display:flex;align-items:center;gap:8px}
.who select{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-weight:600}

nav.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:999px;margin-block:6px 18px;overflow-x:auto;
  position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
nav.tabs button{flex:1;white-space:nowrap;border:0;background:transparent;padding:9px 14px;border-radius:999px;font-weight:600;color:var(--muted)}
nav.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.grid.wide{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.lbl{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px;letter-spacing:.02em}
.in{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.in:focus{border-color:var(--accent);outline:none}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec-h h2{font-size:19px}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 13px;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:5px 10px;font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:600;font-size:13.5px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.target{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tbox{background:var(--sunk);border-radius:10px;padding:10px}
.tbox b{display:block;font-family:var(--mono);font-size:20px}
.tbox span{font-size:12px;color:var(--muted)}
@media (max-width:520px){.target{grid-template-columns:repeat(2,1fr)}}

.bars{position:sticky;top:calc(env(safe-area-inset-top,0px) + 56px);z-index:15;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;grid-template-columns:1fr 1fr;gap:8px 18px}
.bar .t{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600}
.bar .t .num{font-size:12.5px}
.track{height:6px;background:var(--sunk);border-radius:6px;overflow:hidden;margin-top:4px}
.fill{height:100%;border-radius:6px}
.over .t .num{color:var(--danger)}
.bars .cost{grid-column:1/-1;display:flex;justify-content:space-between;border-top:1px dashed var(--line);padding-top:8px;font-size:13px}
.bars .cost b{color:var(--money)}

.meal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.meal-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.meal-h h3{font-size:16px}
.meal-h .m{font-size:12.5px;color:var(--muted)}
.items{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:1fr auto auto auto;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--sunk)}
.item:last-child{border-bottom:0}
.item .nm{font-weight:600;min-width:0}
.item .mm{font-size:12px;color:var(--muted)}
.mm .p{color:var(--p)} .mm .c{color:var(--c)} .mm .f{color:var(--f)} .mm .k{color:var(--kcal)}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.qty button{border:0;background:var(--sunk);width:30px;height:32px;font-weight:700}
.qty input{width:56px;border:0;text-align:center;background:transparent;height:32px;font-family:var(--mono)}
.qty small{padding-right:8px;color:var(--muted);font-size:11.5px;white-space:nowrap}
.price{font-family:var(--mono);font-size:13px;color:var(--money);text-align:right;min-width:62px}
.x{border:0;background:transparent;color:var(--muted);width:26px;height:26px;border-radius:6px}
.x:hover{color:var(--danger);background:var(--sunk)}
.empty{padding:16px 14px;color:var(--muted);font-size:13.5px}
@media (max-width:560px){.item{grid-template-columns:1fr auto}.item .price{grid-column:1;text-align:left}.item .x{grid-row:1;grid-column:2;justify-self:end}}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{background:var(--sunk);border-radius:10px;padding:8px}
.wd b{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.wd select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 4px;font-size:13px}
@media (max-width:700px){.week{grid-template-columns:repeat(2,1fr)}}

.receipt{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.receipt .grp{padding:8px 14px;background:var(--sunk);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.li{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--sunk)}
.li input{width:18px;height:18px;accent-color:var(--accent)}
.li.done .nm{text-decoration:line-through;color:var(--muted)}
.li .amt{font-family:var(--mono);font-weight:600}
.li .pr{font-family:var(--mono);color:var(--money);min-width:70px;text-align:right}
.tot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:14px;background:var(--money-soft)}
.tot div span{display:block;font-size:12px;color:var(--muted)}
.tot div b{font-family:var(--mono);font-size:20px;color:var(--money)}

.ptable{display:flex;flex-direction:column}
.prow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--sunk)}
.prow .pi{display:flex;align-items:center;gap:6px}
.prow .pi input{width:84px;text-align:right;font-family:var(--mono)}
.prow small{color:var(--muted);font-size:12px;white-space:nowrap}

.note{background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:13.5px}
.warn{background:var(--money-soft);border-radius:10px;padding:10px 12px;font-size:13.5px}

.sheet-bg{position:fixed;inset:0;background:rgba(10,14,30,.45);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:18px 18px 0 0;max-height:82%;display:flex;flex-direction:column;
  padding:14px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-width:760px;margin:0 auto}
.sheet .list{overflow-y:auto;margin-top:10px;display:flex;flex-direction:column}
.fopt{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;text-align:left;border:0;border-bottom:1px solid var(--sunk);background:transparent;padding:10px 4px}
.fopt:hover{background:var(--sunk)}
.fopt .nm{font-weight:600}
.fopt .add{font-weight:700;color:var(--accent);font-size:20px;padding:0 8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13.5px;font-weight:600;z-index:60}
@media (prefers-reduced-motion:no-preference){.fill{transition:width .25s}}

/* ---- Soft UI layer ---- */
:root{--raise:6px 6px 14px var(--lo),-6px -6px 14px var(--hi);--raise-sm:3px 3px 7px var(--lo),-3px -3px 7px var(--hi);
  --press:inset 3px 3px 7px var(--lo),inset -3px -3px 7px var(--hi)}
.panel,.meal,.bars,.receipt{border:0;box-shadow:var(--raise);border-radius:var(--r)}
.meal-h{border-bottom:1px solid var(--line)}
.item,.li,.fopt,.prow{border-bottom-color:var(--line)}
.in,.who select,.wd select{border:0;background:var(--bg);box-shadow:var(--press);border-radius:12px}
.in:focus,.who select:focus{box-shadow:var(--press),0 0 0 2px var(--accent)}
nav.tabs{background:var(--bg);box-shadow:var(--press);padding:6px}
nav.tabs button[aria-selected="true"]{background:var(--bg);color:var(--accent);box-shadow:var(--raise-sm)}
.btn{border:0;background:var(--bg);box-shadow:var(--raise-sm);border-radius:12px;color:var(--ink)}
.btn:hover{border:0;color:var(--accent)}
.btn:active,.chip:active,.qty button:active{box-shadow:var(--press)}
.btn.pri{background:var(--accent);color:var(--accent-ink);box-shadow:var(--raise-sm)}
.btn.pri:hover{color:var(--accent-ink);filter:brightness(1.08)}
.btn.ghost{box-shadow:none;background:transparent}
.btn.danger{color:var(--danger)}
.chip{border:0;background:var(--bg);box-shadow:var(--raise-sm)}
.chip[aria-pressed="true"]{background:var(--bg);color:var(--accent);box-shadow:var(--press);border:0}
.tbox{background:var(--bg);box-shadow:var(--press);border-radius:14px}
.track{background:var(--bg);box-shadow:inset 2px 2px 4px var(--lo),inset -2px -2px 4px var(--hi);height:8px}
.qty{border:0;box-shadow:var(--press);border-radius:12px;background:var(--bg);width:max-content}
.qty button{background:transparent;color:var(--accent)}
.wd{background:var(--bg);box-shadow:var(--raise-sm);border-radius:14px}
.receipt .grp{background:var(--sunk)}
.tot{background:var(--sunk)}
.note,.warn{background:var(--bg);box-shadow:var(--press);border-radius:14px}
.note{border-left:3px solid var(--accent)}
.warn{border-left:3px solid var(--money)}
.sheet{background:var(--bg);box-shadow:0 -8px 24px var(--lo)}
.toast{background:var(--accent);color:var(--accent-ink);box-shadow:var(--raise-sm)}
.x:hover{background:var(--bg);box-shadow:var(--press)}
.brand h1{color:var(--accent)}

.mems{display:flex;flex-direction:column;gap:10px}
.mem{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;padding:10px;border-radius:14px;background:var(--bg);box-shadow:var(--raise-sm)}
.mem-n{display:flex;gap:8px;align-items:center;flex:1;min-width:0}
.mem-n input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.mem-n small{display:block;color:var(--muted);font-size:12px}
.mem-f{width:86px}
.mem .x{align-self:center}
.split{display:flex;flex-direction:column;gap:6px}
.split div{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.split b{color:var(--money)}
nav.tabs button{padding:9px 10px}

.themesw{display:flex;background:var(--bg);box-shadow:var(--press);border-radius:999px;padding:4px;gap:2px}
.themesw button{border:0;background:transparent;border-radius:999px;padding:5px 11px;font-weight:700;font-size:13px;color:var(--muted)}
.themesw button[aria-checked="true"]{background:var(--bg);color:var(--accent);box-shadow:var(--raise-sm)}
.who{flex-wrap:wrap}

/* ---- Languages / RTL ---- */
.ctrls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.langsel{border:0;background:var(--bg);box-shadow:var(--raise-sm);border-radius:999px;padding:7px 12px;font-weight:600}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
html[dir=rtl] body,html[dir=rtl] button,html[dir=rtl] input,html[dir=rtl] select,html[dir=rtl] textarea{font-family:"IBM Plex Sans Arabic","Noto Sans Arabic",var(--body)}
html[dir=rtl] h2,html[dir=rtl] h3{font-family:"IBM Plex Sans Arabic","Noto Sans Arabic",var(--display);font-weight:700}
html[dir=rtl] .num{font-family:"IBM Plex Sans Arabic","Noto Sans Arabic",sans-serif;font-variant-numeric:tabular-nums}
.note{border-left:0;border-inline-start:3px solid var(--accent)}
.warn{border-left:0;border-inline-start:3px solid var(--money)}
.price,.li .pr{text-align:end}
.fopt{text-align:start}
bdi{unicode-bidi:isolate}
.qty input{direction:ltr}

.li{grid-template-columns:auto 1fr auto auto auto}
.li .nm{cursor:pointer;min-width:0}
.li .need{display:block;font-size:11.5px;color:var(--muted);font-weight:400}
.home-btn{border:0;background:var(--bg);box-shadow:var(--raise-sm);border-radius:10px;width:32px;height:32px;font-size:16px;color:var(--muted)}
.home-btn[aria-pressed="true"]{box-shadow:var(--press);color:var(--accent)}
.grp-hint{padding:4px 14px 8px;font-size:12px;color:var(--muted);background:var(--sunk)}
a.btn{text-decoration:none;display:inline-flex;align-items:center}
.btn:disabled{opacity:.4}
@media (max-width:480px){.li{grid-template-columns:auto 1fr auto auto;row-gap:2px}.li .pr{grid-column:2/4;grid-row:2;text-align:start;font-size:12px}.li .home-btn{grid-column:4;grid-row:1/3}}
.chart{overflow-x:auto}
.chart svg{width:100%;min-width:300px;height:auto;display:block}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font:11px var(--mono)}
.chart .ma{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round}
.chart .pt{fill:var(--muted);opacity:.55}
.chart .end{fill:var(--accent);stroke:var(--bg);stroke-width:2}

.pedit{display:flex;align-items:center;gap:6px;margin-top:4px}
.pin{width:78px;border:0;background:var(--bg);box-shadow:var(--press);border-radius:8px;padding:4px 8px;font-size:12.5px;color:var(--money)}
.li.street{grid-template-columns:auto 1fr auto auto}

.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.rcard{text-align:start;border:0;background:var(--bg);box-shadow:var(--raise-sm);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:3px;color:var(--ink)}
.rcard b{font-size:14px}
.rcard span{font-size:12px;color:var(--muted)}
.rcard[aria-pressed="true"]{box-shadow:var(--press);color:var(--accent)}
.chip .cnt{opacity:.6;font-size:12px}

.tagx{font-size:10.5px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:1px 6px;vertical-align:middle}
.prow small .num{font-size:11.5px}

.wtag{display:inline-block;font-size:10.5px;font-weight:700;color:var(--p);background:var(--bg);box-shadow:var(--press);border-radius:6px;padding:1px 6px;vertical-align:middle;white-space:nowrap}
.wtag.buy{color:var(--money)}

.mweek{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.mday{background:var(--bg);box-shadow:var(--raise);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.mday h3{font-size:16px;color:var(--accent)}
.mcard{background:var(--bg);box-shadow:var(--press);border-radius:14px;padding:10px 12px}
.mrow{display:flex;gap:10px;align-items:center;justify-content:space-between}
.mcard b{display:block;font-size:14.5px}
.mcard .mk{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.mcard .mm{font-size:12px;color:var(--muted)}
.swap{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.swap .fopt{border-radius:10px}

.li .need.have{color:var(--accent)}
.pedit{padding:10px 14px 12px;background:var(--sunk);border-bottom:1px solid var(--line)}
.pedit .row{align-items:center;gap:8px}
.pedit .pi{display:flex;align-items:center;gap:6px}
.pedit .pi input{width:96px}
.sbar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.sbar i{display:block;height:100%;border-radius:99px}
.grp-t{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:4px}

.ing-t{border:0;background:none;padding:6px 0 0;color:var(--accent);font-weight:600;font-size:13px;cursor:pointer;text-align:start}
.ingbox{grid-column:1/-1;margin-top:6px;padding:8px 10px;border-radius:12px;background:var(--sunk)}
.ingbox .hint{margin:2px 0 6px;font-size:12px}
.ing{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:5px 0;border-top:1px dashed var(--line);font-size:13.5px}
.ing b{font-family:var(--mono);text-align:end}
.ing .mm{grid-column:1/3;font-size:11.5px}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Makla & Mizan</h1>
      <p id="tagline"></p>

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r1=x=>Math.round(x*10)/10, r0=x=>Math.round(x), r2=x=>Math.round(x*100)/100;
const dh=x=>nu(x.toFixed(2),t('dh'));

/* ---------- Maths ---------- */
const LIM={w:[35,250],h:[120,230],age:[14,90],fatPct:[20,40],protKg:[1,3.3],hf:[0,2]};
const clamp=(k,v,def)=>{v=+v;if(!isFinite(v)||v<=0)return def;return Math.min(LIM[k][1],Math.max(LIM[k][0],v))};
/* Targets.
 - Energy: Mifflin-St Jeor BMR × activity × goal factor, with a floor (1200 kcal women, 1500 men) for deficits.
 - Under 18: no deficit (Mifflin is not validated for adolescents; cutting needs medical follow-up).
 - Protein: g/kg of a reference weight = actual weight, capped at the weight for BMI 25, because protein
   needs track lean mass, not fat mass.
 - Fat: % of calories (default 27%), never below 0.6 g/kg of reference weight. Carbs fill the rest. */
function targets(p){
  const w=clamp('w',p.w,70), h=clamp('h',p.h,170), age=clamp('age',p.age,30);
  const bmr=10*w+6.25*h-5*age+(p.sex==='m'?5:-161);
  const tdeeF=bmr*p.act; const tdee=p.tdeeAdj?p.tdeeAdj:tdeeF; const minor=age<18;
  const goal=(minor&&GOALS[p.goal][0]<1)?'maintain':p.goal;
  let kcal=Math.round(tdee*GOALS[goal][0]); let floored=false;
  const floor=p.sex==='f'?1200:1500;
  if(GOALS[goal][0]<1&&kcal<floor){const k2=Math.min(floor,Math.round(tdee));floored=k2>kcal;kcal=k2;}
  const hm=h/100, bmi=w/(hm*hm), refW=bmi>25?25*hm*hm:w;
  const pk=p.protKg?clamp('protKg',p.protKg,GOALS[goal][1]):GOALS[goal][1]; const prot=Math.round(refW*pk);
  const fatPct=clamp('fatPct',p.fatPct,27);
  const fat=Math.max(Math.round(kcal*fatPct/100/9),Math.round(refW*.6));
  const carbs=Math.max(0,Math.round((kcal-prot*4-fat*9)/4));
  return {bmr:Math.round(bmr),tdee:Math.round(tdee),tdeeF:Math.round(tdeeF),kcal,prot,fat,carbs,pk,refW:Math.round(refW),bmi:r1(bmi),usesRef:bmi>25,floored,minor,goal};
}
/* ---------- Weight tracking ----------
 Daily weight swings ±1–2 kg with water and salt, so the app works on trends:
 - 7-day moving average for display;
 - slope = least-squares fit of the raw weigh-ins over the last 28 days (kg/day);
 - measured TDEE = planned intake − slope × 7700 kcal/kg (energy content of body tissue, approx.).
 It needs ≥14 days and ≥6 weigh-ins, and is only as good as how closely the plan was followed. */
const dayNum=d=>Math.round(Date.parse(d+'T12:00:00Z')/864e5);
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function weightStats(p){
  const ws=(p.weights||[]).slice().sort((a,b)=>a.d<b.d?-1:1); if(!ws.length) return null;
  const pts=ws.map(e=>({x:dayNum(e.d),w:+e.w,d:e.d}));
  const ma=pts.map(q=>{const win=pts.filter(r=>r.x<=q.x&&r.x>q.x-7);return win.reduce((s,r)=>s+r.w,0)/win.length});
  const last=pts[pts.length-1].x; const win=pts.filter(q=>q.x>last-28); const span=last-win[0].x;
  let slope=null;
  if(win.length>=6&&span>=14){const mx=win.reduce((s,q)=>s+q.x,0)/win.length,my=win.reduce((s,q)=>s+q.w,0)/win.length;
    let num=0,den=0;win.forEach(q=>{num+=(q.x-mx)*(q.w-my);den+=(q.x-mx)**2});slope=den?num/den:0}
  const avgNow=ma[ma.length-1];
  return {pts,ma,slope,span,n:win.length,avgNow,ratePct:slope!=null?slope*7/avgNow*100:null};
}
function measuredTdee(p,st){if(!st||st.slope==null)return null;const {avg,n}=weekAvg(p);if(!n)return null;
  const v=Math.round((avg.k-st.slope*7700)/10)*10;return (v>900&&v<6000)?{v,intake:Math.round(avg.k)}:null}
function weightChart(st){
  const W=600,H=190,pl=40,pr=12,pt=12,pb=26; const pts=st.pts.slice(-60), ma=st.ma.slice(-60);
  const xs=pts.map(q=>q.x), ys=pts.map(q=>q.w).concat(ma);
  const x0=Math.min(...xs), x1=Math.max(...xs,x0+1); let y0=Math.min(...ys), y1=Math.max(...ys); const padY=Math.max(.5,(y1-y0)*.15); y0-=padY; y1+=padY;
  const X=x=>pl+(x-x0)/(x1-x0)*(W-pl-pr), Y=y=>pt+(y1-y)/(y1-y0)*(H-pt-pb);
  const ticks=[0,1,2,3].map(i=>y0+(y1-y0)*i/3);
  const grid=ticks.map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" class="gl"/><text x="${pl-6}" y="${Y(v)+4}" class="ax" text-anchor="end">${v.toFixed(1)}</text>`).join('');
  const line=ma.map((v,i)=>(i?'L':'M')+X(pts[i].x).toFixed(1)+' '+Y(v).toFixed(1)).join(' ');
  const dots=pts.map(q=>`<circle cx="${X(q.x).toFixed(1)}" cy="${Y(q.w).toFixed(1)}" r="3" class="pt"/>`).join('');
  const lab=(q,a)=>`<text x="${X(q.x)}" y="${H-6}" class="ax" text-anchor="${a}">${q.d.slice(5).split('-').reverse().join('/')}</text>`;
  const endI=ma.length-1;
  return `<div class="chart" dir="ltr"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${t('weight_title')}">${grid}<path d="${line}" class="ma"/>${dots}
    <circle cx="${X(pts[endI].x)}" cy="${Y(ma[endI])}" r="5" class="end"/>${lab(pts[0],'start')}${pts.length>1?lab(pts[endI],'end'):''}</svg></div>`;
}
function vWeight(p){
  const st=weightStats(p); const tg=targets(p);
  const recent=(p.weights||[]).slice().sort((a,b)=>a.d<b.d?1:-1).slice(0,5);
  let info='';
  if(st){
    const rate=st.slope!=null?st.slope*7:null;
    info=`<div class="target" style="grid-template-columns:repeat(2,1fr)">
      <div class="tbox"><span>${t('avg7')}</span><b>${st.avgNow.toFixed(1)}</b><span>${t('u_kg')}</span></div>
      <div class="tbox"><span>${t('per_week')}</span><b style="color:${rate!=null&&rate<0?'var(--p)':'var(--ink)'}">${rate!=null?(rate>0?'+':'')+rate.toFixed(2):'—'}</b><span>${t('u_kg')}</span></div></div>
    ${weightChart(st)}
    <p class="hint">${t('trend_note')}</p>
    ${st.ratePct!=null&&st.ratePct<-1?`<div class="warn">${t('rate_fast',{r:bdi(Math.abs(st.ratePct).toFixed(1))})}</div>`:''}`;
    const m=measuredTdee(p,st);
    if(st.slope==null) info+=`<p class="hint">${t('need_more',{d:bdi(st.span),n:bdi(st.n)})}</p>`;
    else if(!m) info+=`<p class="hint">${t('no_plan')}</p>`;
    else info+=`<div class="note stack" style="gap:8px"><b>${t('tdee_obs',{x:bdi(m.v),y:bdi(tg.tdeeF)})}</b>
      <span class="hint">${t('tdee_explain',{i:bdi(m.intake),r:bdi((st.slope*7).toFixed(2))})}</span>
      <div class="row">${p.tdeeAdj!==m.v?`<button class="btn sm pri" onclick="P().tdeeAdj=${m.v};save();render()">${t('use_tdee')}</button>`:''}</div></div>`;
  }
  return `<section class="panel stack"><h2 style="font-size:19px">${t('weight_title')}</h2>
    <div class="row" style="align-items:flex-end">
      <div style="flex:1;min-width:110px"><label class="lbl" for="wVal">${t('today_w')}</label><input id="wVal" class="in num" type="number" inputmode="decimal" step="0.1" min="35" max="250" placeholder="${p.w}"></div>
      <div style="flex:1;min-width:130px"><label class="lbl" for="wDate">${t('date')}</label><input id="wDate" class="in" type="date" value="${todayStr()}" max="${todayStr()}"></div>
      <button class="btn pri" onclick="logWeight()">${t('log')}</button></div>
    ${st?info:`<p class="hint">${t('no_weights')}</p>`}
    ${p.tdeeAdj?`<div class="row" style="justify-content:space-between"><span class="hint">${t('tdee_used',{x:bdi(p.tdeeAdj)})}</span><button class="btn sm" onclick="delete P().tdeeAdj;save();render()">${t('reset_tdee')}</button></div>`:''}
    ${recent.length?`<div class="ptable">${recent.map(e=>`<div class="prow"><span class="num">${bdi(e.d.split('-').reverse().join('/'))}</span><div class="row"><b class="num">${bdi(e.w.toFixed(1)+' '+t('u_kg'))}</b><button class="x" aria-label="${t('remove')}" onclick="rmWeight('${e.d}')">✕</button></div></div>`).join('')}</div>`:''}
  </section>`;
}
function logWeight(){const w=parseFloat(document.getElementById('wVal').value);const d=document.getElementById('wDate').value||todayStr();
  if(!(w>=35&&w<=250)){document.getElementById('wVal').focus();return}
  const p=P();p.weights=(p.weights||[]).filter(e=>e.d!==d);p.weights.push({d,w:Math.round(w*10)/10});
  const latest=p.weights.slice().sort((a,b)=>a.d<b.d?1:-1)[0];p.w=latest.w;p.example=false;save();render();toast(t('toast_logged'))}
function rmWeight(d){const p=P();p.weights=p.weights.filter(e=>e.d!==d);save();render()}
function itemM(fid,q){
  const f=food(fid); if(!f) return {k:0,p:0,c:0,f:0,cost:0};
  const mul=f.u==='g'?q/100:q;
  return {k:f.m[0]*mul,p:f.m[1]*mul,c:f.m[2]*mul,f:f.m[3]*mul,cost:q*f.f*price(f)};
}
function sum(list){const tt={k:0,p:0,c:0,f:0,cost:0};list.forEach(([id,q])=>{const m=itemM(id,q);for(const k in tt)tt[k]+=m[k]});return tt;}
const dayTot=d=>d?sum(mealKeys().flatMap(k=>d.meals[k]||[])):{k:0,p:0,c:0,f:0,cost:0};
const addT=(a,b,x=1)=>{const o={};for(const k in a)o[k]=a[k]+b[k]*x;return o;};

/* Search matches the food name in every language, so a French word still finds the item while the app is in Darija */
/* Normalises Darija/Arabizi spellings so "tfah", "tfa7" and "Tfaha" match, "qar3a" finds "9ar3a", "adas" finds "3des" */
function norm(x){return String(x).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[\u064b-\u0652]/g,'')
  .replace(/7/g,'h').replace(/[3e]/g,'a').replace(/9|q|g/g,'k').replace(/2/g,'').replace(/5/g,'kh').replace(/ou|o/g,'u').replace(/[iy]/g,'i').replace(/[^a-z0-9\u0600-\u06ff ]/g,' ')
  .replace(/(.)\1+/g,'$1').replace(/\s+/g,' ').trim()}
/* vowels are written many ways in Darija, so a word also matches on its consonants alone (3+ letters) */
const skel=x=>x.replace(/[aiu]/g,'');
const nmatch=(hay,q)=>{const h=norm(hay),hs=skel(h);return norm(q).split(' ').every(w=>h.includes(w)||(skel(w).length>=3&&hs.includes(skel(w))))};
function searchable(f){const base=Object.keys(I18N).map(l=>(I18N[l].foods||[])[FOOD_IDX[f.id]]||'').join(' ');if(f.n!=null)return (f.n+' '+base).toLowerCase();return Object.keys(I18N).map(l=>(I18N[l].foods||[])[FOOD_IDX[f.id]]||'').join(' ').toLowerCase()}

/* ---------- Weekly menu ----------
 The user gives people, budget, max time and exclusions; the app fills 7 days (ftour, ghda, 3cha).
 Generation tries a few hundred random weeks and keeps the best: no recipe twice, varied protein day to day,
 within budget when one is set. Couscous on Friday when the time limit allows it. Every meal can be swapped. */
const TAGS={meat:['l7em_3dem','lhem','kefta','l7em_ras','douwara','kour3in','kebda_ghanmi','mkh','ti7al','gueddid','kachir'],
  chicken:['djaj_kamel','sder','fkhad','kebda','kefta_d'],fish:['7out_kamel','sardine','merla','ton','9imroun','calamar','bbouzroug'],
  dairy:['hlib','lben','perly','jben','fromage','fromage_rouge','zebda','smen','nestle'],egg:['bid','bid_beldi'],
  gluten:['d9i9','d9i9_kamel','smida','couscous_n','makarona_n','makarona','cha3riya','berkoukech','khobz','khobz_b','lwr9a','herbel','belboula','msemen','harcha','choufan']};
const EXCL=['veg','meat','chicken','fish','dairy','egg','gluten'];
const FTOUR=[['fc_oil',[['khobz',.25],['zit_z',1],['atay',1]]],['fc_egg',[['khobz',.25],['bid',2],['atay',1]]],['fc_jben',[['khobz',.25],['jben',2],['l3sel',1],['r_9hwa_7lib',1]]],
  ['fc_oat',[['choufan',60],['hlib',1],['banan',1]]],['fc_amlou',[['khobz',.25],['amlou',1],['atay',1]]]];
const recMeta=r=>{const m=REC_META[r.key]||[];const slots=r.slots||m[2]||({main:'LD',fish:'LD',soup:'D',bread:'B',street:'D'}[r.cat]||'X');return {time:+r.time||m[0]||60,diff:+r.diff||m[1]||2,slots}};
function itemIds(items){const out=[];items.forEach(([id])=>{const r=id.startsWith&&id.startsWith('r_')?recipe(id):null;if(r)r.items.forEach(([i])=>out.push(i));else out.push(id)});return out}
function hasTag(ids,tag){const set=TAGS[tag];return ids.some(i=>set.includes(i))}
function okByExcl(ids,ex){if(ex.includes('veg')&&(hasTag(ids,'meat')||hasTag(ids,'chicken')||hasTag(ids,'fish')))return false;return ex.every(e=>e==='veg'||!hasTag(ids,e))}
const protOf=r=>{const ids=itemIds(r.items);return hasTag(ids,'fish')?'fish':hasTag(ids,'chicken')?'chicken':hasTag(ids,'meat')?'meat':'veg'};
const recCost=r=>recipeFood(r).p;
function menuPools(set){
  const ok=r=>{const m=recMeta(r);return (set.time>=999||m.time<=set.time)&&okByExcl(itemIds(r.items),set.excl)};
  const by=sl=>(S.recipes||[]).filter(r=>recMeta(r).slots.includes(sl)&&ok(r));
  return {L:by('L'),D:by('D'),B:by('B'),F:by('F'),ftour:FTOUR.filter(([,it])=>okByExcl(itemIds(it),set.excl))}}
const pick=a=>a[Math.floor(Math.random()*a.length)];
/* Breakfast recipes are often counted per piece (one beghrir, one msemen): serve enough pieces for ~350 kcal */
const bQty=r=>{const k=recipeFood(r).m[0]||300;return Math.max(1,Math.min(4,Math.round(350/k)))};
function genWeek(set){
  const pl=menuPools(set);
  /* small pools (e.g. vegetarian) borrow from the other meal so the week does not repeat the same dish */
  const uniq=a=>a.filter((r,i)=>a.indexOf(r)===i);
  const lunch=pl.L.length>=7?pl.L:uniq(pl.L.concat(pl.D)), dinner=pl.D.length>=7?pl.D:uniq(pl.D.concat(pl.L));
  if(set.meals.ghda&&!lunch.length||set.meals['3cha']&&!dinner.length) return null;
  const target=set.budget>0?set.budget/7/set.people:null; let best=null;
  for(let t=0;t<400;t++){
    const days=[];let score=0,cost=0;const used={};
    for(let i=0;i<7;i++){const d={};
      if(set.meals.ftour){const wk=i>=5&&pl.B.length&&Math.random()<.7;d.ftour=wk?(r=>[[r.id,bQty(r)],['atay',1]])(pick(pl.B)):pick(pl.ftour)[1].map(x=>x.slice())}
      if(set.meals.ghda){const pool=(i===4&&pl.F.length)?pl.F:lunch;const r=pick(pool);d.ghda=r.id}
      if(set.meals['3cha']){let r=pick(dinner);if(r.id===d.ghda)r=pick(dinner);d['3cha']=r.id}
      days.push(d)}
    days.forEach((d,i)=>{['ghda','3cha'].forEach(k=>{if(!d[k])return;used[d[k]]=(used[d[k]]||0)+1;cost+=recCost(recipe(d[k]))});
      if(d.ftour)cost+=sum(d.ftour).cost;
      if(i&&d.ghda&&days[i-1].ghda&&protOf(recipe(d.ghda))===protOf(recipe(days[i-1].ghda))&&protOf(recipe(d.ghda))!=='veg')score+=2;
      if(d.ghda&&d['3cha']){const a=protOf(recipe(d.ghda)),b=protOf(recipe(d['3cha']));if(a===b&&a!=='veg')score+=3}});
    Object.values(used).forEach(n=>{if(n>1)score+=(n-1)*10});
    if(target){const over=cost-target*7;score+=over>0?Math.min(25,over/(target*7)*40):0;score-=Math.min(0,over)/(target*7)*-3}
    score+=Math.random()*.5;
    if(!best||score<best.score)best={score,days}}
  return best.days}
function menuCostPP(m){let c=0;m.days.forEach(d=>{['ghda','3cha'].forEach(k=>{const r=d[k]&&recipe(d[k]);if(r)c+=recCost(r)});if(d.ftour)c+=sum(d.ftour).cost});return c}
let menuEdit=false, swapAt=null, swapMode='cheaper';

function swapOptions(i,k){const m=S.menu,set=m.set,pl=menuPools(set);
  const uniq=a=>a.filter((r,j)=>a.indexOf(r)===j);const pool=k==='ghda'?uniq((i===4?pl.F:[]).concat(pl.L,pl.L.length<7?pl.D:[])):uniq(pl.D.concat(pl.D.length<7?pl.L:[]));

/* Breakfast options: the simple combos plus breakfast recipes (msemen, baghrir...) with tea */

/* Amount in buy units -> [number, unit]; kg/L round up to 0.1 above 1, to 10 g/ml below */
function amtParts(f,x){
  if(f.b==='kg') return x>=1?[Math.ceil(x*10-1e-9)/10,t('u_kg')]:[Math.ceil(x*100-1e-9)*10,t('u_g')];
  if(f.b==='L') return x>=1?[Math.ceil(x*10-1e-9)/10,t('u_L')]:[Math.ceil(x*100-1e-9)*10,t('u_ml')];
  return [Math.ceil(x-1e-9),unitName(f.bl||'7ba')];
}

/* What you actually take home: whole packs for packaged goods, whole units for counted items */
function buyQty(f,x){const p=PACK[f.id];if(p)return Math.ceil(x/p-1e-9)*p;if(f.b==='u')return Math.ceil(x-1e-9);return x}

function shopData(){
  const agg={}; const parts=[];
  /* sugar for tea and sugar on its own are the same purchase */
  const add=(id,amt)=>{if(id==='atay')id='sokar';agg[id]=(agg[id]||0)+amt};
  const addDay=(d,mult)=>{let c=0;if(!d)return 0;mealKeys().forEach(k=>(d.meals[k]||[]).forEach(([id,q])=>{const f=food(id);if(!f)return;
    if(f.isRec){const r=recipe(id);const n=Math.max(1,+r.servings||1);r.items.forEach(([iid,iq])=>{const g=food(iid);if(g)add(iid,iq*(q/n)*g.f*mult)})}
    else add(id,q*f.f*mult);
    c+=q*f.f*price(f)*mult}));return c};
  S.profiles.forEach(p=>{if(!S.shop[p.id])return;let c=0;p.week.forEach(id=>{c+=addDay(p.days.find(d=>d.id===id),1)});parts.push([esc(p.name),c])});
  if(S.menu&&S.shop.menu){const n=S.menu.set.people;let c=0;
    S.menu.days.forEach(d=>{const meals={ftour:d.ftour||[],ghda:d.ghda?[[d.ghda,1]]:[],'3cha':d['3cha']?[[d['3cha'],1]]:[]};
      Object.values(meals).forEach(list=>list.forEach(([id,q])=>{const f=food(id);if(!f)return;
        if(f.isRec){const r=recipe(id);const sv=Math.max(1,+r.servings||1);r.items.forEach(([iid,iq])=>{const g=food(iid);if(g)add(iid,iq*(q/sv)*g.f*n)})}else add(id,q*f.f*n);
        c+=q*f.f*price(f)*n}))});
    parts.push([t('menu_src')+' (×'+n+')',c])}
  const rows=Object.keys(agg).filter(id=>food(id)&&agg[id]>0).map(id=>{const f=food(id);const monthly=STAPLE.has(id);const street=f.cat==='zan9a';
    const week=agg[id],need=monthly?week*30/7:week,hv=S.pantry[id],have=hv===true?0:(+hv||0);
    /* 'true' = enough at home; a number = amount at home in buy units (kg / L / pieces). Monthly items count as covered when there's enough for this week. */
    const home=hv===true||have>0&&have>=(monthly?week:need)-1e-9;
    const buy=home?buyQty(f,need):buyQty(f,Math.max(0,need-have));
    return {id,f,monthly,street,week,need:home?need:Math.max(0,need-have),buy,cost:buy*price(f),home,have:hv===true?true:have,done:!!S.checked[id]}})
    .sort((a,b)=>CAT_KEYS.indexOf(a.f.cat)-CAT_KEYS.indexOf(b.f.cat));
  const cost=parts.reduce((s,x)=>s+x[1],0);
  return {rows,parts,cost};
}

let pEdit=null;
const pUnit=f=>f.b==='kg'?[1000,t('u_g')]:f.b==='L'?[1000,t('u_ml')]:[1,unitName(f.bl||'7ba')];
function fmtHave(f,x){const [k,u]=pUnit(f);const v=x*k;return nu(k>1?(v>=1000?(Math.round(v/100)/10)+'':Math.round(v)+''):(Math.round(v*10)/10)+'',esc(k>1&&v>=1000?(f.b==='kg'?t('u_kg'):t('u_L')):u))}
function pantryEditor(x){const [k,u]=pUnit(x.f);const v=typeof x.have==='number'&&x.have>0?Math.round(x.have*k*10)/10:'';
  return `<div class="pedit"><label class="lbl" for="pq_${x.id}">${t('pan_q')}</label>
    <div class="row"><div class="pi"><input id="pq_${x.id}" class="in num" type="number" min="0" step="${k>1?50:1}" inputmode="decimal" value="${v}" onkeydown="if(event.key==='Enter')pantrySet('${x.id}')"><small>${esc(u)}</small></div>
    <button class="btn sm pri" onclick="pantrySet('${x.id}')">${t('save')}</button>
    <button class="btn sm" onclick="pantrySet('${x.id}','all')">${t('pan_all')}</button>
    ${S.pantry[x.id]?`<button class="btn sm ghost" onclick="pantrySet('${x.id}','none')">${t('pan_none')}</button>`:''}</div></div>`}
function pantry(id){pEdit=pEdit===id?null:id;render();if(pEdit)setTimeout(()=>{const e=document.getElementById('pq_'+id);if(e)e.focus()},30)}
function pantrySet(id,how){
  if(how==='all')S.pantry[id]=true;
  else if(how==='none')delete S.pantry[id];
  else{const f=food(id),el=document.getElementById('pq_'+id),v=parseFloat(el&&el.value);
    if(v>0)S.pantry[id]=Math.round(v/pUnit(f)[0]*1000)/1000;else delete S.pantry[id]}
  pEdit=null;save();render()}
/* End of week: leftovers of what was bought go to "at home"; what was eaten from home comes off */
function newWeek(){const {rows}=shopData();let n=0;
  rows.forEach(x=>{if(x.street||x.have===true)return;
    let h=(+x.have||0)+(x.done?x.buy:0)-x.week;const thr=x.f.b==='u'?.5:.01;
    if(h>thr){S.pantry[x.id]=Math.round(h*1000)/1000;n++}else delete S.pantry[x.id]});
  S.checked={};pEdit=null;save();render();toast(t('new_week_done',{n}))}

/* ---------- Real spending ---------- */
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
/* Estimate for the trip being logged: what's ticked as bought, or the whole trip if nothing is ticked */
function spendEst(rows){const done=rows.filter(x=>x.done&&!x.street&&!x.home);return (done.length?done:rows.filter(x=>!x.home&&!x.street)).reduce((s,x)=>s+x.cost,0)}
function addSpend(){const a=parseFloat(document.getElementById('spA').value);if(!(a>0)){toast(t('spend_bad'));return}
  const d=document.getElementById('spD').value||today();
  S.spend.push({id:uid(),d,a:Math.round(a*100)/100,e:Math.round(spendEst(shopData().rows))});
  S.spend.sort((x,y)=>x.d<y.d?-1:x.d>y.d?1:0);if(S.spend.length>200)S.spend=S.spend.slice(-200);save();render();toast(t('toast_spend'))}
function delSpend(id){if(delArm!=='s_'+id){delArm='s_'+id;render();return}S.spend=S.spend.filter(x=>x.id!==id);delArm=null;save();render()}
function spendHTML(rows,cost){
  const est=spendEst(rows),ym=today().slice(0,7),bud=parseFloat(S.budget);
  const mon=S.spend.filter(x=>x.d.slice(0,7)===ym).reduce((s,x)=>s+x.a,0);
  const recent=S.spend.filter(x=>x.e>0).slice(-8),A=recent.reduce((s,x)=>s+x.a,0),E=recent.reduce((s,x)=>s+x.e,0);
  const gap=E>0?Math.round((A/E-1)*100):null;
  const fd=d=>bdi(new Date(d+'T12:00').toLocaleDateString(lang()==='en'?'en-GB':'fr-FR',{day:'numeric',month:'short'}));
  const pct=bud?Math.min(100,mon/bud*100):0;
  return `<section class="panel stack"><div class="sec-h"><h2>${t('spend_title')}</h2></div>
    <p class="hint">${t('spend_hint')}</p>
    <div class="row" style="align-items:flex-end">
      <div style="width:150px"><label class="lbl" for="spA">${t('spend_amount')}</label><input id="spA" class="in num" type="number" min="0" step="1" inputmode="decimal" placeholder="${est?Math.round(est):''}" onkeydown="if(event.key==='Enter')addSpend()"></div>
      <div style="width:160px"><label class="lbl" for="spD">${t('date')}</label><input id="spD" class="in" type="date" value="${today()}" max="${today()}"></div>
      <button class="btn pri" onclick="addSpend()">${t('spend_add')}</button></div>
    ${est?`<p class="hint">${t('spend_est',{x:dh(est)})}</p>`:''}
    <div class="split"><div><span>${t('spend_month')}</span><b>${dh(mon)}</b></div><div><span>${t('spend_vs')}</span><b>${dh(cost*30/7)}</b></div>
      ${bud?`<div><span>${mon>bud?t('budget_over'):t('budget_left')}</span><b style="color:${mon>bud?'var(--danger)':'var(--p)'}">${dh(Math.abs(bud-mon))}</b></div>`:''}</div>
    ${bud?`<div class="sbar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(pct)}"><i style="width:${pct}%;background:${mon>bud?'var(--danger)':'var(--p)'}"></i></div>`:''}
    ${gap!=null?`<p class="hint gap">${Math.abs(gap)<=7?t('spend_gap_ok'):gap>0?t('spend_gap_up',{p:bdi(gap)}):t('spend_gap_down',{p:bdi(-gap)})}</p>`:''}
    ${S.spend.length?`<div class="grp-t">${t('spend_hist')}</div><div class="ptable">${S.spend.slice(-6).reverse().map(x=>{const g=x.e>0?Math.round((x.a/x.e-1)*100):null;
      return `<div class="prow"><div style="min-width:0"><b>${dh(x.a)}</b> <small>· ${fd(x.d)}</small>${x.e>0?`<small style="display:block">${t('spend_est',{x:dh(x.e)})} <span style="color:${g>7?'var(--danger)':g<-7?'var(--p)':'var(--muted)'}">${bdi((g>0?'+':g<0?'−':'')+Math.abs(g)+'%')}</span></small>`:''}</div>
        <button class="btn sm danger" onclick="delSpend('${x.id}')">${delArm==='s_'+x.id?t('confirm_del'):t('del')}</button></div>`}).join('')}</div>`:`<p class="hint">${t('spend_none')}</p>`}
  </section>`}
function copyList(){const txt=shopText(shopData().rows);try{navigator.clipboard.writeText(txt).then(()=>toast(t('toast_copied')),()=>toast(txt.slice(0,60)))}catch(e){}}
function chk(id,v){S.checked[id]=v;save();render()}

/* ---------- Prices ---------- */
function vPrix(){
  const unitL=f=>t('dh')+'/'+(f.b==='kg'?t('u_kg'):f.b==='L'?t('u_L'):unitName(f.bl||'7ba'));
  return `<div class="stack">
  <div class="warn">${t('price_warn')}</div>
  <section class="panel"><div class="sec-h"><h2>${t('prices')}</h2><button class="btn sm ghost" onclick="S.prices={};save();render();toast(t('toast_reset'))">${t('reset_prices')}</button></div>
  ${CAT_KEYS.map(c=>`<h3 style="font-size:14px;margin-top:14px;color:var(--muted)">${catName(c)}</h3><div class="ptable">${allFoods().filter(f=>f.cat===c).map(f=>`
    <div class="prow"><div style="min-width:0"><div style="font-weight:600">${esc(fname(f))}${f.isOv?` <span class="tagx">${t('edited')}</span>`:''}</div><small>${nu(f.u==='g'?100:1,esc(uLab(f)))}: ${macro({k:f.m[0],p:f.m[1],c:f.m[2],f:f.m[3]})}</small>${f.nt?`<small style="display:block">${esc(noteOf(f))}</small>`:''}</div>
    <div class="pi"><input id="pr_${f.id}" class="in" type="number" step="0.1" min="0" value="${price(f)}" onchange="setP('${f.id}',this.value)"><small>${esc(unitL(f))}</small><button class="x" aria-label="${t('edit')}" title="${t('edit')}" onclick="editCustom('${f.id}')">✎</button></div></div>`).join('')}</div>`).join('')}
  </section>
  ${S.custom.length?`<section class="panel stack"><h2 style="font-size:19px">${t('custom_list')}</h2>
    <div class="ptable">${S.custom.map(f=>`<div class="prow"><div style="min-width:0"><div style="font-weight:600">${esc(f.n)}</div><small>${catName(f.cat)} · ${macro({k:f.m[0],p:f.m[1],c:f.m[2],f:f.m[3]})}</small></div>
      <div class="row"><button class="btn sm" onclick="editCustom('${f.id}')">${t('edit')}</button><button class="btn sm danger" onclick="delCustom('${f.id}')">${delArm==='c_'+f.id?t('confirm_del'):t('del')}</button></div></div>`).join('')}</div></section>`:''}
  <section class="panel stack" id="customForm"><h2 style="font-size:19px">${editingCustom?t('edit')+' · '+esc(food(editingCustom)?fname(food(editingCustom)):''):t('add_custom')}</h2>
    ${editingCustom&&FOOD_IDX[editingCustom]!=null?`<p class="hint">${t('edit_food_hint')}</p>`:''}
    ${customFormHTML()}
    <div class="row"><button class="btn pri" onclick="addCustom()">${editingCustom?t('save'):t('add')}</button>${editingCustom?`<button class="btn" onclick="editingCustom=null;render()">${t('cancel')}</button>`:''}${editingCustom&&S.ov[editingCustom]?`<button class="btn danger" onclick="resetFood('${editingCustom}')">${t('reset_food')}</button>`:''}<span id="cErr" class="hint" style="color:var(--danger)"></span></div>
  </section>
  <section class="panel stack"><h2 style="font-size:19px">${t('backup')}</h2>
    <p class="hint">${t('backup_hint')}</p>
    <p class="hint"><b>${S.lastBackup?t('last_backup',{d:bdi(new Date(S.lastBackup).toLocaleDateString(lang()==='en'?'en-GB':'fr-FR'))}):t('never_backup')}</b></p>
    <div class="row"><button class="btn pri" onclick="exportFile()">${t('export_file')}</button>
      <label class="btn" for="impF" style="cursor:pointer">${t('import_file')}</label><input id="impF" type="file" accept="application/json,.json" hidden onchange="importFile(this)">
      <button class="btn" onclick="exportData()">${t('copy_backup')}</button></div>
    <textarea id="impT" class="in num" rows="3" placeholder="${t('paste_ph')}"></textarea>
    <div class="row"><button class="btn" onclick="importData()">${t('import')}</button><span id="impMsg" class="hint"></span></div>
    <div class="row" style="border-top:1px solid var(--line);padding-top:12px"><button class="btn danger" onclick="resetAll()">${delArm==='all'?t('reset_confirm'):t('reset_all')}</button></div>
  </section></div>`;
}
function setP(id,v){const x=parseFloat(v);if(isNaN(x))delete S.prices[id];else S.prices[id]=Math.max(0,x);save();render()}
let editingCustom=null;
/* How a custom food is measured. f = buy units per measure (kg or L for spoons and glasses, so the list says "1 kg jben") */
const MU={g:{u:'g',b:'kg',f:.001,d:100,s:25},ml:{u:'g',gu:'ml',b:'L',f:.001,d:200,s:50},u:{u:'u',ul:'7ba',b:'u',bl:'7ba',f:1,d:1,s:1},
  mk:{u:'u',ul:'mo3al9a',b:'kg',f:.015,d:1,s:.5},ms:{u:'u',ul:'mo3al9a_s',b:'kg',f:.005,d:1,s:1},kas:{u:'u',ul:'kas',b:'L',f:.2,d:1,s:.5}};
const muOf=f=>f.mu||(f.u==='g'?'g':'u');
function muLabels(mu){if(mu==='keep'&&editingCustom){const f=food(editingCustom);return {mac:t('macros_per',{u:(f.u==='g'?'100 ':'1 ')+uLab(f)}),pr:t('price_per',{u:buyLab(f)})}}
const per={g:'100 '+t('u_g'),ml:'100 '+t('u_ml'),u:unitName('7ba'),mk:unitName('mo3al9a'),ms:unitName('mo3al9a_s'),kas:unitName('kas')}[mu];
  const pu={g:t('u_kg'),ml:t('u_L'),u:unitName('7ba'),mk:t('u_kg'),ms:t('u_kg'),kas:t('u_L')}[mu];return {mac:t('macros_per',{u:per}),pr:t('price_per',{u:pu})}}
function muUpdate(){const el=document.getElementById('cU');if(!el)return;const l=muLabels(el.value);
  document.getElementById('cMacLbl').textContent=l.mac;document.getElementById('cPLbl').textContent=l.pr}
function customFormHTML(){const bi=editingCustom&&FOOD_IDX[editingCustom]!=null;const ef=bi&&food(editingCustom);const l=muLabels(bi?'keep':'g');
  return `<div class="grid">
      <div><label class="lbl" for="cN">${t('name')}</label><input id="cN" class="in" placeholder="${t('custom_ph')}"></div>
      <div><label class="lbl" for="cCat">${t('category')}</label><select id="cCat" class="in">${CAT_KEYS.map(k=>`<option value="${k}">${catName(k)}</option>`).join('')}</select></div>
      <div><label class="lbl" for="cU">${t('calc_by')}</label><select id="cU" class="in" onchange="muUpdate()">${bi?`<option value="keep">${t('unit_keep',{u:esc(uLab(ef))})}</option>`:''}${Object.keys(MU).map(k=>`<option value="${k}">${t('unit_'+k)}</option>`).join('')}</select></div>
      <div><label class="lbl" for="cP" id="cPLbl">${l.pr}</label><input id="cP" class="in num" type="number" step="0.1" min="0"></div>
    </div>
    <p class="hint" id="cMacLbl" style="margin:0">${l.mac}</p>
    <div class="grid">
      <div><label class="lbl" for="cK">${t('kcal_u')}</label><input id="cK" class="in num" type="number" min="0"></div>
      <div><label class="lbl" for="cPr">${t('prot_g')}</label><input id="cPr" class="in num" type="number" step="0.1" min="0"></div>
      <div><label class="lbl" for="cC">${t('carbs_g')}</label><input id="cC" class="in num" type="number" step="0.1" min="0"></div>
      <div><label class="lbl" for="cF">${t('fat_g')}</label><input id="cF" class="in num" type="number" step="0.1" min="0"></div>
    </div>`}
function addCustom(){
  const g=id=>document.getElementById(id).value; const n=g('cN').trim(); const mu=g('cU'); const M=MU[mu]||{};
  const nums=['cP','cK','cPr','cC','cF'].map(i=>parseFloat(g(i)));
  if(mu==='keep'&&!editingCustom)return;
  if(!n||nums.some(x=>isNaN(x)||x<0)){document.getElementById('cErr').textContent=t('custom_err');return}
  const fields={n,cat:g('cCat'),mu,u:M.u,gu:M.gu||null,ul:M.ul||'7ba',bl:M.bl||'7ba',b:M.b,f:M.f,d:M.d,s:M.s,m:nums.slice(1),p:nums[0]};
  if(editingCustom&&FOOD_IDX[editingCustom]!=null){const id=editingCustom,cur=food(id),base=baseFood(id);
    const o={cat:fields.cat,m:fields.m};if(n!==fname(base))o.n=n;
    if(mu!=='keep'){['mu','u','gu','ul','bl','b','f','d','s'].forEach(k=>o[k]=fields[k]);
      if(cur.u!==fields.u){const conv=q=>fields.u==='g'?q*100:Math.max(1,r1(q/100));eachItem(it=>{if(it[0]===id)it[1]=conv(it[1])})}}
    else ['mu','u','gu','ul','bl','b','f','d','s'].forEach(k=>{if(S.ov[id]&&S.ov[id][k]!==undefined)o[k]=S.ov[id][k]});
    S.ov[id]=o;S.prices[id]=fields.p;editingCustom=null;save();render();toast(t('toast_saved'));return}
  if(editingCustom){const f=food(editingCustom);
    if(f.u!==fields.u){/* g <-> unit: convert stored quantities so the meals keep a sensible size */
      const conv=q=>fields.u==='g'?q*100:Math.max(1,r1(q/100));
      eachItem((it)=>{if(it[0]===f.id)it[1]=conv(it[1])});}
    Object.assign(f,fields);delete S.prices[f.id];editingCustom=null;save();render();toast(t('toast_saved'));return}
  const nf=Object.assign({id:'c_'+uid()},fields);S.custom.push(nf);
  if(sheetMeal&&sheetNew){sheetNew=false;addFood(nf.id);return}
  save();render();toast(t('toast_custom',{n}))}
function eachItem(fn){eachList(arr=>arr.forEach((it,i)=>fn(it,i,arr)))}
function editCustom(id){editingCustom=id;render();const f=food(id);
  const set=(i,v)=>{const el=document.getElementById(i);if(el)el.value=v};
  set('cN',fname(f));set('cCat',f.cat);set('cU',FOOD_IDX[id]!=null?'keep':muOf(f));muUpdate();set('cP',price(f));set('cK',f.m[0]);set('cPr',f.m[1]);set('cC',f.m[2]);set('cF',f.m[3]);
  const el=document.getElementById('customForm');if(el)el.scrollIntoView({behavior:'smooth',block:'start'})}
function resetFood(id){const cur=food(id),base=baseFood(id);
  if(cur.u!==base.u){const conv=q=>base.u==='g'?q*100:Math.max(1,r1(q/100));eachItem(it=>{if(it[0]===id)it[1]=conv(it[1])})}
  delete S.ov[id];delete S.prices[id];editingCustom=null;save();render();toast(t('toast_reset_food'))}
function delCustom(id){if(delArm!=='c_'+id){delArm='c_'+id;render();return}
  S.custom=S.custom.filter(f=>f.id!==id);delete S.prices[id];delete S.checked[id];
  eachList(arr=>{for(let i=arr.length-1;i>=0;i--)if(arr[i][0]===id)arr.splice(i,1)});
  if(editingCustom===id)editingCustom=null;delArm=null;save();render();toast(t('toast_deleted'))}
function resetAll(){if(delArm!=='all'){delArm='all';render();return}
  const keep={lang:S.lang,theme:S.theme};try{localStorage.removeItem(KEY)}catch(e){}
  load();Object.assign(S,keep);save();delArm=null;curDay=null;tab='menu';render();toast(t('toast_reset_all'))}
function backupNag(){const old=!S.lastBackup||(Date.now()-S.lastBackup>30*864e5);
  return old?`<div class="warn row" style="justify-content:space-between"><span>${S.lastBackup?t('backup_old'):t('never_backup')}</span><button class="btn sm" onclick="go('prix');setTimeout(()=>{const e=document.getElementById('impF');e&&e.closest('section').scrollIntoView({behavior:'smooth'})},50)">${t('go_backup')}</button></div>`:''}
function exportFile(){
  S.lastBackup=Date.now();save();
  const s=JSON.stringify(S,null,1); const d=new Date().toISOString().slice(0,10);
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:'application/json'}));a.download='makla-mizan-'+d+'.json';
    document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
    render();toast(t('toast_saved'))}catch(e){exportData()}}
function importFile(inp){const f=inp.files&&inp.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{document.getElementById('impT').value=r.result;importData()};r.readAsText(f)}
function exportData(){S.lastBackup=Date.now();save();const s=JSON.stringify(S);const el=document.getElementById('impT');
  const ok=()=>toast(t('toast_copied'));const fb=()=>{el.value=s;el.select();toast(t('toast_select'))};
  try{navigator.clipboard.writeText(s).then(ok,fb)}catch(e){fb()}}
function importData(){try{const o=JSON.parse(document.getElementById('impT').value);if(!o.profiles||!o.profiles.length)throw 0;S=o;normalize();save();applyTheme();curDay=null;render();toast(t('toast_import'))}catch(e){document.getElementById('impMsg').textContent=t('import_err')}}

/* ---------- Toast ---------- */
let tt;function toast(m){const r=document.getElementById('toastRoot');r.innerHTML=`<div class="toast">${esc(m)}</div>`;clearTimeout(tt);tt=setTimeout(()=>r.innerHTML='',1800)}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});

/* ---------- Theme: light / dark / follow phone ---------- */
function applyTheme(){
  const th=(S&&S.theme)||'auto'; const root=document.documentElement;
  if(th==='auto') root.removeAttribute('data-theme'); else root.setAttribute('data-theme',th);
  document.querySelectorAll('#themeSw button').forEach(b=>b.setAttribute('aria-checked',String(b.dataset.t===th)));
  const dark=th==='dark'||(th==='auto'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);
  const m=document.querySelector('meta[name="theme-color"]'); if(m) m.setAttribute('content',dark?'#252a2c':'#ece5da');
}
function setTheme(th){S.theme=th;save();applyTheme()}
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme)}catch(e){}

load();render();applyTheme();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persisted().then(ok=>{if(!ok)navigator.storage.persist()})}catch(e){}

/* ---------- PWA ---------- */
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;document.getElementById('installBtn').hidden=false});
function doInstall(){if(!deferredPrompt)return;deferredPrompt.prompt();deferredPrompt.userChoice.finally(()=>{deferredPrompt=null;document.getElementById('installBtn').hidden=true})}
window.addEventListener('appinstalled',()=>{document.getElementById('installBtn').hidden=true;toast(t('toast_installed'))});
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}

</script>

</body>
</html>
