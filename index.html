<style>
/* Soft UI (neumorphism): surfaces share the page colour and are lifted or pressed with paired light/dark shadows; one deep-teal accent */
:root{
  --bg:#ece5da; --surface:#ece5da; --sunk:#e3dbcf; --line:#d6ccbd;
  --ink:#1f2a2b; --muted:#625e57;
  --accent:#0f5257; --accent-ink:#ffffff; --accent-soft:#dfe6e1;
  --money:#825612; --money-soft:#e7dccb;
  --p:#276b51; --c:#7b590d; --f:#a04047; --kcal:#944a1e;
  --danger:#ac343d;
  --hi:rgba(255,255,255,.85); --lo:rgba(163,146,120,.55);
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r:18px;
  color-scheme: only light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#252a2c; --surface:#252a2c; --sunk:#1f2325; --line:#343a3d;
  --ink:#e9e6df; --muted:#a19d94;
  --accent:#5fb8b2; --accent-ink:#10292a; --accent-soft:#2c3537;
  --money:#e2b25a; --money-soft:#2e2b24;
  --p:#5fc79a; --c:#e0b448; --f:#ec7a82; --kcal:#ee9356; --danger:#ef7b82;
  --hi:rgba(255,255,255,.06); --lo:rgba(0,0,0,.55);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#252a2c; --surface:#252a2c; --sunk:#1f2325; --line:#343a3d;
  --ink:#e9e6df; --muted:#a19d94;
  --accent:#5fb8b2; --accent-ink:#10292a; --accent-soft:#2c3537;
  --money:#e2b25a; --money-soft:#2e2b24;
  --p:#5fc79a; --c:#e0b448; --f:#ec7a82; --kcal:#ee9356; --danger:#ef7b82;
  --hi:rgba(255,255,255,.06); --lo:rgba(0,0,0,.55);
  color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;padding-top:env(safe-area-inset-top,0px)}
#installBtn[hidden]{display:none}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:960px;margin:0 auto}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:12px 12px}
.brand h1{font-size:21px;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.brand p{margin:0;color:var(--muted);font-size:13px}
.who{display:flex;align-items:center;gap:8px}
.who select{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-weight:600}

/* bottom navigation: four sections, thumbs-reachable, labels under icons */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(4,minmax(0,150px));justify-content:center;gap:4px;
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));
  background:var(--bg);border-top:1px solid var(--line)}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:transparent;padding:6px 4px;border-radius:12px;font-weight:600;font-size:11.5px;color:var(--muted);min-width:0}
nav.tabs button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
nav.tabs svg,.iconbtn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-selected="true"]{color:var(--accent);background:var(--accent-soft)}
.iconbtn{border:0;background:var(--bg);box-shadow:var(--raise-sm);border-radius:12px;width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink);flex:none}
.iconbtn[aria-pressed="true"]{color:var(--accent);box-shadow:var(--press)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;border-radius:14px;background:var(--bg);box-shadow:var(--press)}
.seg button{border:0;background:transparent;padding:8px 6px;border-radius:10px;font-weight:600;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--accent);box-shadow:var(--raise-sm)}
body.noscroll{overflow:hidden}
.ob{position:fixed;inset:0;z-index:55;background:var(--bg);overflow-y:auto;
  padding:calc(18px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.ob-in{max-width:520px;min-height:100%;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.ob h2{font-size:24px;line-height:1.2}
.ob-hero{font-size:56px;line-height:1}
.ob-dots{display:flex;gap:6px}
.ob-dots i{width:8px;height:8px;border-radius:99px;background:var(--line)}
.ob-dots i.on{width:24px;background:var(--accent)}
.ob-num{display:flex;align-items:center;justify-content:center;gap:22px;padding:10px 0}
.ob-num b{font-size:48px;font-family:var(--mono);min-width:72px;text-align:center}
.ob-num .btn{width:52px;height:52px;font-size:24px;border-radius:16px}
.ob-opt{display:flex;flex-direction:column;gap:2px;text-align:start;border:0;border-radius:16px;padding:14px 16px;background:var(--bg);box-shadow:var(--raise-sm);color:var(--ink)}
.ob-opt b{font-size:16px}
.ob-opt[aria-pressed="true"]{box-shadow:var(--press),0 0 0 2px var(--accent)}
.ob-foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:10px}
.ob-foot .btn{padding:12px 20px;font-size:15px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.grid.wide{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.lbl{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px;letter-spacing:.02em}
.in{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.in:focus{border-color:var(--accent);outline:none}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec-h h2{font-size:19px}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 13px;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:5px 10px;font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:600;font-size:13.5px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.target{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tbox{background:var(--sunk);border-radius:10px;padding:10px}
.tbox b{display:block;font-family:var(--mono);font-size:20px}
.tbox span{font-size:12px;color:var(--muted)}
@media (max-width:520px){.target{grid-template-columns:repeat(2,1fr)}}

.bars{position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:15;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;grid-template-columns:1fr 1fr;gap:8px 18px}
.bar .t{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600}
.bar .t .num{font-size:12.5px}
.track{height:6px;background:var(--sunk);border-radius:6px;overflow:hidden;margin-top:4px}
.fill{height:100%;border-radius:6px}
.over .t .num{color:var(--danger)}
.bars .cost{grid-column:1/-1;display:flex;justify-content:space-between;border-top:1px dashed var(--line);padding-top:8px;font-size:13px}
.bars .cost b{color:var(--money)}

.meal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.meal-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.meal-h h3{font-size:16px}
.meal-h .m{font-size:12.5px;color:var(--muted)}
.items{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:1fr auto auto auto;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--sunk)}
.item:last-child{border-bottom:0}
.item .nm{font-weight:600;min-width:0}
.item .mm{font-size:12px;color:var(--muted)}
.mm .p{color:var(--p)} .mm .c{color:var(--c)} .mm .f{color:var(--f)} .mm .k{color:var(--kcal)}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.qty button{border:0;background:var(--sunk);width:30px;height:32px;font-weight:700}
.qty input{width:56px;border:0;text-align:center;background:transparent;height:32px;font-family:var(--mono)}
.qty small{padding-right:8px;color:var(--muted);font-size:11.5px;white-space:nowrap}
.price{font-family:var(--mono);font-size:13px;color:var(--money);text-align:right;min-width:62px}
.x{border:0;background:transparent;color:var(--muted);width:26px;height:26px;border-radius:6px}
.x:hover{color:var(--danger);background:var(--sunk)}
.empty{padding:16px 14px;color:var(--muted);font-size:13.5px}
@media (max-width:560px){.item{grid-template-columns:1fr auto}.item .price{grid-column:1;text-align:left}.item .x{grid-row:1;grid-column:2;justify-self:end}}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{background:var(--sunk);border-radius:10px;padding:8px}
.wd b{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.wd select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 4px;font-size:13px}
@media (max-width:700px){.week{grid-template-columns:repeat(2,1fr)}}

.receipt{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.receipt .grp{padding:8px 14px;background:var(--sunk);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.li{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--sunk)}
.li input{width:18px;height:18px;accent-color:var(--accent)}
.li.done .nm{text-decoration:line-through;color:var(--muted)}
.li .amt{font-family:var(--mono);font-weight:600}
.li .pr{font-family:var(--mono);color:var(--money);min-width:70px;text-align:right}
.tot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:14px;background:var(--money-soft)}
.tot div span{display:block;font-size:12px;color:var(--muted)}
.tot div b{font-family:var(--mono);font-size:20px;color:var(--money)}

.ptable{display:flex;flex-direction:column}
.prow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--sunk)}
.prow .pi{display:flex;align-items:center;gap:6px}
.prow .pi input{width:84px;text-align:right;font-family:var(--mono)}
.prow small{color:var(--muted);font-size:12px;white-space:nowrap}

.note{background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:13.5px}
.warn{background:var(--money-soft);border-radius:10px;padding:10px 12px;font-size:13.5px}

.sheet-bg{position:fixed;inset:0;background:rgba(10,14,30,.45);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:18px 18px 0 0;max-height:82%;display:flex;flex-direction:column;
  padding:14px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-width:760px;margin:0 auto}
.sheet .list{overflow-y:auto;margin-top:10px;display:flex;flex-direction:column}
.fopt{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;text-align:left;border:0;border-bottom:1px solid var(--sunk);background:transparent;padding:10px 4px}
.fopt:hover{background:var(--sunk)}
.fopt .nm{font-weight:600}
.fopt .add{font-weight:700;color:var(--accent);font-size:20px;padding:0 8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13.5px;font-weight:600;z-index:60}
@media (prefers-reduced-motion:no-preference){.fill{transition:width .25s}}

/* ---- Soft UI layer ---- */
:root{--raise:6px 6px 14px var(--lo),-6px -6px 14px var(--hi);--raise-sm:3px 3px 7px var(--lo),-3px -3px 7px var(--hi);
  --press:inset 3px 3px 7px var(--lo),inset -3px -3px 7px var(--hi)}
.panel,.meal,.bars,.receipt{border:0;box-shadow:var(--raise);border-radius:var(--r)}
.meal-h{border-bottom:1px solid var(--line)}
.item,.li,.fopt,.prow{border-bottom-color:var(--line)}
.in,.who select,.wd select{border:0;background:var(--bg);box-shadow:var(--press);border-radius:12px}
.in:focus,.who select:focus{box-shadow:var(--press),0 0 0 2px var(--accent)}
.btn{border:0;background:var(--bg);box-shadow:var(--raise-sm);border-radius:12px;color:var(--ink)}
.btn:hover{border:0;color:var(--accent)}
.btn:active,.chip:active,.qty button:active{box-shadow:var(--press)}
.btn.pri{background:var(--accent);color:var(--accent-ink);box-shadow:var(--raise-sm)}
.btn.pri:hover{color:var(--accent-ink);filter:brightness(1.08)}
.btn.ghost{box-shadow:none;background:transparent}
.btn.danger{color:var(--danger)}
.chip{border:0;background:var(--bg);box-shadow:var(--raise-sm)}
.chip[aria-pressed="true"]{background:var(--bg);color:var(--accent);box-shadow:var(--press);border:0}
.tbox{background:var(--bg);box-shadow:var(--press);border-radius:14px}
.track{background:var(--bg);box-shadow:inset 2px 2px 4px var(--lo),inset -2px -2px 4px var(--hi);height:8px}
.qty{border:0;box-shadow:var(--press);border-radius:12px;background:var(--bg);width:max-content}
.qty button{background:transparent;color:var(--accent)}
.wd{background:var(--bg);box-shadow:var(--raise-sm);border-radius:14px}
.receipt .grp{background:var(--sunk)}
.tot{background:var(--sunk)}
.note,.warn{background:var(--bg);box-shadow:var(--press);border-radius:14px}
.note{border-left:3px solid var(--accent)}
.warn{border-left:3px solid var(--money)}
.sheet{background:var(--bg);box-shadow:0 -8px 24px var(--lo)}
.toast{background:var(--accent);color:var(--accent-ink);box-shadow:var(--raise-sm)}
.x:hover{background:var(--bg);box-shadow:var(--press)}
.brand h1{color:var(--accent)}

.mems{display:flex;flex-direction:column;gap:10px}
.mem{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;padding:10px;border-radius:14px;background:var(--bg);box-shadow:var(--raise-sm)}
.mem-n{display:flex;gap:8px;align-items:center;flex:1;min-width:0}
.mem-n input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.mem-n small{display:block;color:var(--muted);font-size:12px}
.mem-f{width:86px}
.mem .x{align-self:center}
.split{display:flex;flex-direction:column;gap:6px}
.split div{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.split b{color:var(--money)}

.themesw{display:flex;background:var(--bg);box-shadow:var(--press);border-radius:999px;padding:4px;gap:2px}
.themesw button{border:0;background:transparent;border-radius:999px;padding:5px 11px;font-weight:700;font-size:13px;color:var(--muted)}
.themesw button[aria-checked="true"]{background:var(--bg);color:var(--accent);box-shadow:var(--raise-sm)}
.who{flex-wrap:wrap}

/* ---- Languages / RTL ---- */
.ctrls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.langsel{border:0;background:var(--bg);box-shadow:var(--raise-sm);border-radius:999px;padding:7px 12px;font-weight:600}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
html[dir=rtl] body,html[dir=rtl] button,html[dir=rtl] input,html[dir=rtl] select,html[dir=rtl] textarea{font-family:"IBM Plex Sans Arabic","Noto Sans Arabic",var(--body)}
html[dir=rtl] h2,html[dir=rtl] h3{font-family:"IBM Plex Sans Arabic","Noto Sans Arabic",var(--display);font-weight:700}
html[dir=rtl] .num{font-family:"IBM Plex Sans Arabic","Noto Sans Arabic",sans-serif;font-variant-numeric:tabular-nums}
.note{border-left:0;border-inline-start:3px solid var(--accent)}
.warn{border-left:0;border-inline-start:3px solid var(--money)}
.price,.li .pr{text-align:end}
.fopt{text-align:start}
bdi{unicode-bidi:isolate}
.qty input{direction:ltr}

.li{grid-template-columns:auto 1fr auto auto auto}
.li .nm{cursor:pointer;min-width:0}

.home-btn{border:0;background:var(--bg);box-shadow:var(--raise-sm);border-radius:10px;width:32px;height:32px;font-size:16px;color:var(--muted)}
.home-btn[aria-pressed="true"]{box-shadow:var(--press);color:var(--accent)}
.grp-hint{padding:4px 14px 8px;font-size:12px;color:var(--muted);background:var(--sunk)}
a.btn{text-decoration:none;display:inline-flex;align-items:center}
.btn:disabled{opacity:.4}
@media (max-width:480px){.li{grid-template-columns:auto 1fr auto auto;row-gap:2px}.li .pr{grid-column:2/4;grid-row:2;text-align:start;font-size:12px}.li .home-btn{grid-column:4;grid-row:1/3}}
.chart{overflow-x:auto}
.chart svg{width:100%;min-width:300px;height:auto;display:block}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font:11px var(--mono)}
.chart .ma{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round}
.chart .pt{fill:var(--muted);opacity:.55}
.chart .end{fill:var(--accent);stroke:var(--bg);stroke-width:2}

.pedit{display:flex;align-items:center;gap:6px;margin-top:4px}
.pin{width:78px;border:0;background:var(--bg);box-shadow:var(--press);border-radius:8px;padding:4px 8px;font-size:12.5px;color:var(--money)}
.li.street{grid-template-columns:auto 1fr auto auto}

.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.rcard{text-align:start;border:0;background:var(--bg);box-shadow:var(--raise-sm);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:3px;color:var(--ink)}
.rcard b{font-size:14px}
.rcard span{font-size:12px;color:var(--muted)}
.rcard[aria-pressed="true"]{box-shadow:var(--press);color:var(--accent)}
.chip .cnt{opacity:.6;font-size:12px}

:root{--card:#f8f4ed;--edge:rgba(110,90,60,.16);--edge2:rgba(110,90,60,.30);--well:#ece5da;

:root[data-theme="dark"]{--card:#2e3437;--edge:rgba(255,255,255,.08);--edge2:rgba(255,255,255,.17);--well:#22272a;

const STEPS={"tajine":["Ghsel ddjaja w 9tte3ha; 9echer lbatata w lkhizzou w 9tte3hom 3wad, w 9tte3 lbsla w maticha.","F tajine awla 7lla: zit, lbsla w ddjaja m3a l3triya (mel7a, skinjbir, lkherkoum). 9elleb 5 d9aye9 3la nar mtwssta.","Zid kas d lma, ghtti w khelli ytayb 20 d9i9a 3la nar hadya.","Rtteb lbatata, lkhizzou w maticha fo9 ddjaja, w zid nss kas d lma ila nchef.","Ghtti w khelli 30–35 d9i9a 7tta ttayb lkhodra (jerrbha b lmos).","Zid zitoun f lekher, khelli 5 d9aye9 w 9eddem."],"khodra_djaj":["9tte3 sder ddjaj mkoub sghar, w lbatata, lkhizzou, l9ar3a w lfelfla 9ta3 9ad 9ad.","F mqla kbira: zit w lbsla, w zid ddjaj m3a l3triya (mel7a, skinjbir, felfla). 9elleb 6–8 d9aye9 7tta yhmar.","Zid lbatata w lkhizzou w nss kas d lma, ghtti w khelli 10 d9aye9.","Zid l9ar3a w lfelfla, 9elleb w khelli 8–10 d9aye9 7tta ytaybo w yb9aw mtmaskin.","Dou9 lmel7a w 9eddem sokhoun."],"rouz_kefta":["Khlet lkefta m3a l3triya (mel7a, kamoun, t7mira) w 9ad koriyat sghar.","F 7lla: zit, lbsla w lfelfla, 9elleb 3 d9aye9, w zid maticha m7kouka 5 d9aye9.","Zid koriyat lkefta w 9elleb chwiya 7tta yhmaro.","Ghsel rrouz w zidou, w zid lma (2 kissan l kol kas d rrouz). Ghtti w khelli 18–20 d9i9a 3la nar hadya bla ma t7ell.","7iyed men nar w khellih mghtti 5 d9aye9 9bel ma t9eddem."],"mar9a":["9tte3 l7em 9ta3 kbar, w 7ekk lbsla w maticha.","F tajine awla cocotte: zit, lbsla, l7em w l3triya (mel7a, skinjbir, lkherkoum, l9erfa). 9elleb 5 d9aye9.","Zid maticha w 2 kissan d lma, w ghtti.","Khelli ytayb 1 sa3a w nss 3la nar hadya (awla 35 d9i9a f cocotte) 7tta yrteb l7em w t9el lmer9a.","Dou9 lmel7a w 9eddem m3a lkhobz."],"tajine_zbib":["Tayb l7em m3a zit, chwiya d lbsla m7kouka, l3triya (mel7a, skinjbir, ras l7anout, za3fran) w 2 kissan d lma: 1 sa3a 3la nar hadya.","9tte3 lbsla lba9ya 3wad, w neqqe3 zzbib f lma sokhoun 10 d9aye9.","Tfaya: tayb lbsla f mqla m3a chwiya d zit, l9erfa w l3sel 15–20 d9i9a 7tta tdbel w t7mar.","Zid zzbib l tfaya f 5 d9aye9 lekhrin.","7mmes llouz f mqla bla zit.","Rtteb l7em f tbsil, tfaya fo9o, w llouz fo9 kolchi."],"9hwa_7lib":["Sekhhen l7lib 3la nar hadya bla ma yfour.","Dir 9hwa f lkas w kebb 3liha chwiya d lma sokhoun (awla dir express).","Zid l7lib w sokar 3la ddou9 w 7errek."],"couscous":["Neqqe3 l7emmes men lil. F l9edra: l7em, lbsla, maticha, smen, zit w l3triya (mel7a, skinjbir, za3fran, lkherkoum). 9elleb 10 d9aye9.","Zid lma (3–4 l) w l7emmes, w khelli ytayb 40 d9i9a.","Ghrref lkesksou b chwiya d lma w zit, w fwwro f lkeskas fo9 l9edra 15 d9i9a.","Kebbo f l9es3a, ferrko b ydik m3a lma mel7a, w 3awed fwwro (3 merrat f lmajmou3).","Zid lkhodra l9as7a 9bel (lkrom, lkhizzou, left), men b3d l9r3a l7emra w lbatata l7lowa, w l9ar3a f lekher.","Rtteb: lkesksou, l7em f lwest, lkhodra 7welih, w seyyeb lmer9a b chwiya."],"couscous_tfaya":["Neqqe3 l7emmes men lil. Tayb l7em m3a chwiya d lbsla, zit, l3triya (mel7a, skinjbir, za3fran, l9erfa), l7emmes w lma: 1 sa3a.","Fwwer lkesksou 3 merrat fo9 l9edra, w bin kol merra ferrko b lma mel7a w zit.","Tfaya: lbsla 3wad m3a zzbib, zebda, sokar, l9erfa w ma zhar, 3la nar hadya 30–40 d9i9a 7tta tdbel w t7mar.","7mmes llouz awla 9lih.","Rtteb lkesksou, l7em f lwest, tfaya w llouz fo9, w seyyeb lmer9a."],"couscous_bidawi":["Neqqe3 l7emmes men lil. F l9edra: l7em, lbsla, maticha, touma, smen w l3triya; 9elleb 10 d9aye9, w zid lma w l7emmes.","Khelli ytayb 45 d9i9a, w fwwer lkesksou fo9 l9edra 3 merrat (ferrko b lma mel7a bin kol merra).","Zid lkhodra l9as7a 9bel (lkrom, lkhizzou, left), w l9r3a l7emra f lekher (15–20 d9i9a).","Rtteb lkesksou, l7em f lwest, lkhodra 7welih, w seyyeb lmer9a."],"couscous_belboula":["Neqqe3 lfoul men lil w 9echro.","Tayb l7em m3a lbsla, maticha, zit, smen w l3triya, w zid lma w lfoul: 40 d9i9a.","Ghrref lbelboula b lma w zit zitoun, w fwwerha 3 merrat fo9 l9edra (katchreb lma ktar men lkesksou).","Zid lkhodra: lkrom, left w lkhizzou 9bel, w l9r3a l7emra f lekher.","Rtteb lbelboula, l7em w lkhodra, w seyyeb lmer9a."],"badaz":["Chermel l7out b 9zbour, zit zitoun w l3triya (mel7a, kamoun, t7mira, skinjbir), w khellih 30 d9i9a.","F l9edra: maticha, lfelfla, chwiya d 9zbour, zit w l3triya, w zid lma w l7emmes (mneqqe3 men lil).","Ghrref smida d dra b lma w zit argan, w fwwerha 3 merrat fo9 l9edra (ferrekha bin kol merra).","Zid lkhodra l lmer9a (lkhizzou 9bel, l9ar3a f lekher), w 7et l7out f 15 d9i9a lekhrin bach ma yttfettetch.","Rtteb lbadaz, l7out w lkhodra fo9o, w seyyeb lmer9a w chwiya d zit argan."],"seksu_fassi":["Fwwer lkesksou 3 merrat fo9 lma ghali, w ferrko b lma w zebda bin kol merra.","Sle9 lbid 10 d9aye9, 9echro w 9ssmo.","7mmes llouz w de99o chwiya m3a sokar w l9erfa.","Sekhhen l7lib m3a ma zhar w chwiya d sokar.","Rtteb lkesksou b zebda, sokar w l9erfa, w llouz w lbid fo9o; l7lib sokhoun f kas jenbo."],"tajine_ber9ou9":["F tajine awla cocotte: l7em, lbsla m7kouka, touma, zit, smen, 9zbour w l3triya (mel7a, skinjbir, za3fran, l9erfa). 9elleb 5 d9aye9.","Zid 2–3 kissan d lma w khelli ytayb 1 sa3a w nss 3la nar hadya 7tta yrteb.","Sle9 lber9ou9 f chwiya d lma 10 d9aye9, w zid sokar, zebda, l9erfa w ma zhar, w khellih y3e99ed 10 d9aye9.","Khelli lmer9a dyal l7em t9el 10 d9aye9 bla ghta.","7mmes llouz w znjlan.","Rtteb l7em, lber9ou9 fo9o, w rech llouz w znjlan."],"tajine_djaj_msyer":["Chermel ddjaja b touma, 9zbour, smen, zit w l3triya (mel7a, skinjbir, za3fran, lkherkoum); khelliha sa3a ila 3ndek lwe9t.","Tayb ddjaja m3a lbsla m7kouka, lkebda w 2 kissan d lma 45 d9i9a, w 9elleb merra merra.","Khrrej lkebda, de99ha w rjje3ha l lmer9a bach t9el.","Zid zitoun w l7amed msyer (9echro 3wad), w khelli 10–15 d9i9a.","Ila bghitiha m7mmra: dekhel ddjaja l lferran 10 d9aye9, w seyyeb 3liha lmer9a."],"tajine_kefta":["Khlet lkefta m3a 9zbour w l3triya (mel7a, kamoun, t7mira), w 9ad koriyat sghar.","F tajine: zit, lbsla, touma w maticha m7kouka m3a l3triya; khelliha 10 d9aye9 7tta tbda t9el.","Rtteb koriyat lkefta f lmer9a, ghtti w khelli 15 d9i9a 3la nar hadya.","Kesser lbid fo9, ghtti w khelli 5 d9aye9 7tta yjmed.","Rech 9zbour w 9eddem m3a lkhobz."],"tajine_9o9":["Tayb l7em m3a lbsla, touma, zit w l3triya (mel7a, skinjbir, lkherkoum) w 2 kissan d lma: 1 sa3a.","Neqqi l9o9: 7iyed lwr9 l9ase7 w ch3ar lwest, w khelli l9elb f lma m3a l7amed bach ma yk7elch.","Zid l9o9, jjelbana w l7amed msyer l l7em, w khelli 20–25 d9i9a 7tta ytaybo.","Rech 9zbour w 9eddem."],"tajine_sferjel":["Tayb l7em m3a lbsla m7kouka, zit, l3triya (mel7a, skinjbir, za3fran, l9erfa) w 2 kissan d lma: 1 sa3a w nss.","9echer sferjel, 9tte3o rba3 w 7iyed l9elb, w khellih f lma bach ma yk7elch.","Sle9 sferjel f chwiya d lmer9a 10–15 d9i9a bla ma yt7ell.","F mqla: zebda, sokar w l9erfa, w zid sferjel 7tta y3e99ed w y7mar.","Rtteb l7em, sferjel fo9o, w seyyeb lmer9a."],"tajine_khodra":["F tajine: zit, lbsla, touma, l7em w l3triya (mel7a, skinjbir, lkherkoum, kamoun). 9elleb 5 d9aye9 w zid kas d lma.","Ghtti w khelli l7em ytayb 30 d9i9a 3la nar hadya.","Rtteb lkhodra fo9 l7em f chkel hrem: lbatata, lkhizzou, jjelbana, l9ar3a w 9ta3 maticha.","Zid 9zbour, zitoun, l7amed msyer w nss kas d lma.","Ghtti w khelli 35–40 d9i9a 3la nar hadya bla ma t9elleb."],"tajine_7out":["Chermoula: 9zbour, touma, l7amed, zit zitoun w l3triya (mel7a, kamoun, t7mira, skinjbir).","Ghsel l7out w 9tte3o 9ta3 kbar, w chermlo b nss chermoula; khellih 30 d9i9a f lfrigo.","9tte3 lbatata w lkhizzou 3wad r9a9, w lfelfla w maticha 7l9at.","F tajine: 3wad lkhizzou (bach ma ylsse9ch), lbatata w chermoula lba9ya, w l7out fo9hom.","Rtteb lfelfla, maticha w zitoun fo9 l7out, w zid nss kas d lma.","Ghtti w khelli 30–35 d9i9a 3la nar hadya (awla f lferran 200° 40 d9i9a)."],"tajine_soussi":["9tte3 lbsla 3wad, w 7ekk wa7da m3aha l lmer9a.","F tajine: zit zitoun, lbsla m7kouka, l7em w l3triya (mel7a, skinjbir, za3fran). 9elleb w zid kas d lma.","Ghtti w khelli 1 sa3a 3la nar hadya (awla 3la lfa7m).","Rtteb 3wad lbsla w zzbib fo9 l7em, w khelli 30–40 d9i9a 7tta tdbel lbsla.","Seyyeb zit argan f lekher 9bel ma t9eddem."],"tajine_bouzroug":["Ghsel lbouzroug mzyan f lma bared; ila kan b l9echra, sle9o 5 d9aye9 w 7iyed lla7m.","F 7lla: zit, touma w maticha m7kouka m3a l3triya (mel7a, kamoun, t7mira, skinjbir): 10 d9aye9.","Zid lbouzroug w 9zbour, w khelli 10 d9aye9 3la nar hadya (ila ttawwel kay9ssa7).","Zid l7amed f lekher w 9eddem."],"tajine_meloukhia":["Tayb l7em m3a lbsla, touma, zit w l3triya (mel7a, skinjbir, lkherkoum) w kas d lma: 40 d9i9a.","Ghsel lmeloukhia w 9tte3 rousha b chwiya (bla ma t7ellha) bach tb9a mtmaska w ma tlzze9ch.","Zid maticha m7kouka l l7em, w rtteb lmeloukhia fo9 bla ma t9ellebha.","Ghtti w khelli 25–30 d9i9a 3la nar hadya, w rech 9zbour."],"tanjia":["9tte3 l7em (ka3b awla jarret) 9ta3 kbar.","Dekhel kolchi f tanjia: l7em, touma, l7amed msyer, smen, zit, za3fran w l3triya (mel7a, kamoun, skinjbir), w nss kas d lma.","Ghtti fommha b lkaghet d lferran w rbto b 7bel, w 7errekha mzyan bach ykhtlet kolchi.","Tayb 5–6 swaye3 f lferran 130–150° (awla 3nd lfernatchi d l7ammam).","7ell tanjia w khelliha 5 d9aye9, w 9eddem m3a lkhobz."],"rfissa":["Neqqe3 l7elba w l3des chi swaye3 (awla men lil).","Tayb ddjaja m3a lbsla 3wad, touma, smen, zit, l7elba w l3triya (ras l7anout, mel7a, skinjbir, za3fran): 1 sa3a.","Zid l3des w lma, w khelli 20–30 d9i9a 7tta ttayb ddjaja w t9el lmer9a.","Wejjed trid (chouf lwasfa dyalo) awla msmen, w 9tte3o b ydik chrayet.","Fwwer trid fo9 lmer9a 10 d9aye9 bach ysakhhen.","Rtteb trid f tbsil, seyyeb lmer9a w l3des, w 7et ddjaja f lwest."],"rfissa_3amya":["Neqqe3 l7elba, l3des w lfoul men lil.","F l9edra: zit, smen, lbsla, touma, maticha, lgueddid w l3triya (ras l7anout, mel7a, skinjbir): 10 d9aye9.","Zid l7elba, lfoul, l3des w lma, w khelli 40–50 d9i9a 7tta ytaybo.","9tte3 lkhobz (d lbare7 7sen) 9ta3 sghar, w 7mmro chwiya f lferran.","Rtteb lkhobz f tbsil, seyyeb 3lih lmer9a sokhna, w rech 9zbour."],"bastilla_djaj":["Tayb ddjaja m3a lbsla bezzaf, smen, zit, 9zbour w l3triya (mel7a, skinjbir, za3fran, l9erfa): 1 sa3a.","7iyed l3dem w fettet ddjaja; khelli lbsla t9el bezzaf 3la nar.","Zid lbid mdroub l lmer9a w 9elleb 7tta yjmed (bhal lbid mherres).","9li llouz w de99o m3a sokar, l9erfa w ma zhar.","Dhen lmou9la b zebda, ferrech lwr9a w dir tbe9at: lbid, ddjaj, llouz; w sedd b lwr9a.","Dhen b zebda w dekhel l lferran 180° 25–30 d9i9a 7tta t7mar; zewwe9 b sokar w l9erfa."],"bastilla_7out":["Neqqe3 cha3riya f lma sokhoun 5 d9aye9 w sefiha.","Chermel l7out, l9imroun w lcalamar b touma, 9zbour, l7amed, sauce soja w l3triya (mel7a, kamoun, t7mira, felfla 7arra).","F mqla kbira: zit w lchampignon, men b3d l7out w fawakih lba7r 8–10 d9aye9; zid cha3riya w l7amed msyer, w khelli tberred.","Dhen lmou9la b zebda, ferrech lwr9a, 7et l7chwa w sedd.","Dhen b zebda, rech lfromage, w dekhel l lferran 180° 25–30 d9i9a."],"bastilla_7lib":["Dhen lwr9a b zit w 7mmerha f lferran 180° 5–8 d9aye9 7tta tweli me9rmcha.","Krema: dreb lmaizena f chwiya d l7lib bared, w zidha l l7lib li kayghli m3a sokar w ma zhar; 9elleb 7tta yt9el.","7mmes llouz w de99o m3a chwiya d sokar w l9erfa.","F tbsil: tab9a d lwr9a, lkrema, llouz, w 3awed.","9eddemha djdida bach tb9a lwr9a me9rmcha."],"seffa":["Tayb ddjaja m3a lbsla, smen, zit, za3fran w l3triya (mel7a, skinjbir, l9erfa): 45 d9i9a, w khelli lmer9a t9el.","Ghrref cha3riya b zit w fwwerha 3 merrat fo9 lma ghali, w bin kol merra rech 3liha chwiya d lma.","Zid zebda w zzbib f lfwara lekhra.","9li llouz w de99o.","Dfen ddjaja f wsst cha3riya f chkel 9obba, w zewwe9 b llouz, l9erfa w sokar (awla l7lib m7elli)."],"l7em_m7emmer":["Tayb l7em m3a lbsla m7kouka, touma, smen, zit, za3fran, l3triya (mel7a, kamoun, skinjbir) w lma: 1 sa3a w nss 7tta yrteb.","Khelli lmer9a t9el bla ghta 7tta tweli deghmira (lbsla katdbel w kat9el).","Dhen l7em b zebda w dekhlo l lferran 200° 15–20 d9i9a 7tta y7mar.","Rtteb l7em w seyyeb 3lih ddeghmira."],"mechoui":["Dreb zebda, smen, touma, mel7a, kamoun w za3fran; dir tqob f lktef b lmos w dhno kollo.","Ghttih b papier alu w dekhlo l lferran 160° 3 swaye3, w seyyeb 3lih ddhen dyalo kol sa3a.","7iyed papier alu w 3li lferran l 220° 20–30 d9i9a 7tta y7mar.","9eddem b kamoun w mel7a jenbo."],"mrouzia":["Chermel l7em b ras l7anout, touma, smen, zit, za3fran w mel7a; khellih sa3a.","Tayb l7em m3a lma 1 sa3a w nss 7tta yrteb.","Neqqe3 zzbib, w zidou m3a l3sel w l9erfa l l7em; khelli 30 d9i9a 3la nar hadya 7tta t9el lmer9a w t3e99ed.","9li llouz awla sle9o w 9echro.","Rtteb l7em w zzbib, w llouz fo9."],"t9lya":["Ghsel ddouwara mzyan b lma sokhoun w l7amed, w sle9ha 10 d9aye9, men b3d 9tte3ha sghar.","F l9edra: zit, lbsla, touma, maticha m7kouka, 9zbour w l3triya (kamoun, t7mira, felfla 7arra, mel7a).","Zid ddouwara w lma, ghtti w khelli 1 sa3a w nss 7tta trteb (awla 40 d9i9a f cocotte).","Zid zitoun w l7amed msyer, w khelli lmer9a t9el 10 d9aye9."],"kour3in":["Neqqe3 l7emmes w lherbel men lil; chwwet lkour3in w ghselhom mzyan.","F cocotte: zit, lbsla, touma, lkour3in w l3triya (mel7a, skinjbir, lkherkoum, kamoun), w zid lma bezzaf.","Zid l7emmes w lherbel, w khelli 2 swaye3 (awla 1 sa3a f cocotte) 7tta yrteb lkour3in.","Neqqe3 zzbib, w zidou m3a l3sel f 20 d9i9a lekhrin.","9eddem sokhoun b lmer9a t9ila."],"boulfaf":["Chwi lkebda 2–3 d9aye9 3la lfa7m (bach tjmed chwiya), w 9tte3ha mkoub.","Rech mel7a w kamoun, w lff kol mkoub f chrit r9i9 d ch7ma.","Dekhel lmkoubat f lkhwabech, w chwihom 3la lfa7m 7tta t7mar ch7ma.","9eddem b kamoun w mel7a, m3a atay."],"rras_mbekher":["Neqqi rras mzyan (chwwet, 7ekk w ghsel), w 9ssmo.","Rech 3lih mel7a w kamoun, w 7et lbsla w 9zbour f lkeskas.","Fwwro fo9 lma ghali 2–3 swaye3 7tta yrteb (awla 1 sa3a f cocotte).","9eddem b kamoun w mel7a."],"gueddid":["9tte3 l7em chrayet twal (3erdhom 2 cm), w 7iyed l3dem.","Chermlo b mel7a, touma, l3triya (kamoun, kosbor, felfla 7arra), lkhal w zit zitoun; khellih lil kamel f lfrigo.","N9er lchrayet f 7bel f blasa fiha chems w ri7 4–7 ayyam, w ghttih b tolle r9i9a men dbban.","Mli ynchef mzyan, 7ettou f bocal mghtti (awla tayb bih lkhli3 b ddhen)."],"ti7al":["Ghsel tti7al w 7ell fih jib b lmos men jiha w7da.","7chwa: lkefta, lkebda m9tte3a sghar, ch7ma, lbsla, rrouz (mslou9 chwiya), 9zbour, touma, lbid w l3triya (kamoun, t7mira, felfla 7arra, mel7a).","3emmer tti7al b l7chwa (bla ma t3emmro bezzaf) w khiyetou.","Sle9o 15 d9i9a f lma, men b3d dekhlo l lferran 180° 40–50 d9i9a 7tta y7mar.","Khellih yberred chwiya, 9tte3o 7l9at w 9eddem."],"mkh":["Ghsel lmkh b lma bared w 7iyed lghcha r9i9a, w sle9o 3 d9aye9 f lma m3a lkhal.","F mqla: zit, touma w maticha m7kouka m3a l3triya (kamoun, t7mira, felfla 7arra, mel7a): 10 d9aye9.","Zid lmkh m9tte3 w 9zbour, w khelli 10 d9aye9 3la nar hadya bla bezzaf d t9lab.","9eddem m3a lkhobz."],"sardine_mla9i":["Neqqi sardine: 7iyed rras, lkercha w l3dem, w 7ell kol w7da bhal ktab.","Chermoula: 9zbour, touma, l7amed, mel7a w l3triya (kamoun, t7mira, felfla 7arra).","Dhen chermoula 3la sardina w lsse9 jouj m3a b3dhom (mla9i).","Dewwezhom f d9i9 w 9lihom f zit sokhoun 3–4 d9aye9 l kol jiha (awla f lferran 200° 15 d9i9a b zit 9lil).","7ettehom 3la lkaghet bach ychreb zit zayed."],"kwari":["Neqqi sardine (7iyed rras, lkercha w l3dem) w ferrmha awla de99ha.","Khletha m3a rrouz (mslou9 chwiya), ch7ma, 9zbour, touma w l3triya (kamoun, t7mira, felfla 7arra, mel7a), w 9ad kwari sghar.","Lmer9a f tajine: zit, touma, maticha m7kouka, lfelfla w l3triya: 10 d9aye9.","Rtteb lkwari f lmer9a, zid zitoun w l7amed msyer, ghtti w khelli 20 d9i9a 3la nar hadya."],"7outa_m3emra":["Chermoula: 9zbour, touma, l7amed, zit zitoun w l3triya (kamoun, t7mira, felfla 7arra, mel7a).","Ghsel l7outa, 7ell kerchha w chermelha men dakhel w men bra.","7chwa: cha3riya mslou9a, l9imroun, zitoun, l7amed msyer w chwiya d chermoula; 3emmer biha l7outa.","F tbsil d lferran: 3wad lbatata w lkhizzou, l7outa fo9hom, w lfelfla w maticha 7welha.","Ghtti b papier alu w dekhel l lferran 200° 40 d9i9a, men b3d 7iyed lghta 15 d9i9a 7tta t7mar."],"paella":["9tte3 sder ddjaj mkoub, w neqqi l9imroun, lcalamar (7l9at) w lbouzroug.","F mqla kbira: zit w ddjaj 7tta yhmar, men b3d lbsla, lfelfla, touma w maticha m7kouka m3a l3triya w za3fran.","Zid rrouz w 9elleb d9i9a, w zid lma sokhoun (2 kissan w nss l kol kas d rrouz).","Rtteb lcalamar, lbouzroug w jjelbana, w khelli 15 d9i9a 3la nar hadya bla ma t9elleb.","Zid l9imroun f 5 d9aye9 lekhrin, ghtti b fouta 5 d9aye9 w 9eddem (m3a l7amed ila bghiti)."],"harira":["Neqqe3 l7emmes w lfoul men lil (w 9echer lfoul).","F l9edra: l7em mkoub sghar, lbsla, 9zbour, smen w l3triya (mel7a, skinjbir, lkherkoum, l9erfa): 5 d9aye9.","Zid maticha m7kouka, l7emmes, lfoul, l3des w lma (2–3 l), w khelli 45 d9i9a (awla 20 d9i9a f cocotte).","Tedwira: dreb d9i9 f lma bared mzyan bla 7obbat.","Zid cha3riya 5 d9aye9, men b3d kebb tedwira b chwiya w 7errek dima 7tta tt9el (10 d9aye9).","9eddem m3a tmer awla l7amed."],"bissara":["Neqqe3 lfoul lyabes (m9cher) men lil w ghselo.","Tayb lfoul m3a touma f lma (yghettih b 2 sbe3): 45 d9i9a 7tta y7ell (awla 20 d9i9a f cocotte).","Rhyo b lmixeur, w zid lma sokhoun ila t9el bezzaf, w mel7a w kamoun.","9eddemha sokhna, w seyyeb zit zitoun, kamoun w t7mira fo9."],"loubia":["Neqqe3 lloubia men lil, sle9ha 10 d9aye9 w kebb dak lma (bach t9ell nnfkha).","F cocotte: lloubia, lbsla, touma, maticha m7kouka, zit w l3triya (mel7a, kamoun, t7mira, skinjbir).","Zid lma 7tta yghettiha, w tayb 1 sa3a 3la nar hadya (awla 25 d9i9a f cocotte) 7tta trteb.","Zid 9zbour f lekher w khelli lmer9a t9el 5 d9aye9."],"3des":["Ghsel l3des w 9elleb fih (7iyed l7jer).","F l9edra: l3des, lbsla, touma, maticha m7kouka, lkhizzou (7l9at), zit w l3triya (mel7a, kamoun, t7mira, skinjbir).","Zid lma (yghettih b 3 sbe3) w khelli 35–40 d9i9a 3la nar hadya 7tta yrteb.","Zid 9zbour f lekher w 9eddem."],"7ssouwa":["F l9edra: lma, chwiya d lbsla m7kouka, zit w l3triya (mel7a, kamoun), w khelliha tghli.","Zid lbelboula b chwiya w 7errek bla ma t7bes, w khelliha 20–25 d9i9a 3la nar hadya.","Zid l7lib f lekher w khelli 5 d9aye9; 9eddemha sokhna b chwiya d zit zitoun fo9."],"herbel":["Neqqe3 lherbel men lil (awla 2 swaye3) w sefih.","Tayb lherbel f lma m3a mel7a 40–45 d9i9a 7tta y7ell (awla 20 d9i9a f cocotte).","Zid l7lib w khelli 10 d9aye9 3la nar hadya, w 7errek.","9eddem b zebda fo9 (w l3sel ila bghiti)."],"berkoukech":["Neqqe3 l7emmes w lfoul men lil.","F l9edra: l7em, lbsla, maticha m7kouka, 9zbour, zit w l3triya (mel7a, skinjbir, lkherkoum): 5 d9aye9.","Zid lma, l7emmes, lfoul w l3des, w khelli 40 d9i9a.","Zid lberkoukech b chwiya w 7errek, w khelli 15–20 d9i9a 7tta ytayb."],"berkoukech_soussi":["Fwwer lberkoukech merrtin fo9 lma ghali (awla sle9o f lma 10 d9aye9 w sefih).","Zid l7lib w khelli 10 d9aye9 3la nar hadya, w 7errek.","9eddem f zlayef m3a amlou, zit argan w l3sel fo9."],"tagoula":["Ghelli lma m3a mel7a.","Zid lbelboula b chwiya w 7errek dima bla ma t7bes, 25–30 d9i9a 7tta tweli t9ila.","Zid l7lib f lekher w 7errek.","9eddemha f tbsil: dir jib f lwest w 3emmro b zit argan w l3sel."],"khobz_ddar":["Fiyye9 lkhmira f lma fater m3a sokar 10 d9aye9.","Khlet d9i9 kamel, d9i9 lfors w lmel7a; zid lkhmira w zit, w 3jen b lma fater 10 d9aye9 7tta tweli l3jina rteba.","9ssem l3jina 2, dewwerhom w fred kol wa7da, w rech znjlan fo9.","Ghttihom b fouta w khellihom ykhmero 1 sa3a f blasa sokhna.","Tqeb lkhobz b fourchette w tayb f lferran 220° 20–25 d9i9a 7tta y7mar."],"msmen":["Khlet d9i9, smida, mel7a, sokar w lkhmira, w 3jen b lma fater 10 d9aye9 7tta tweli l3jina rteba w mlsa.","9ssem l3jina koriyat 9ad 9ad, dhenhom b zit w khellihom 10 d9aye9.","Fred kol koura b zit 7tta tweli r9i9a, rech smida w zebda, w twiha mrrba3 (msmen) awla lffha 7bel w dewwerha (meloui).","Fred lmrrba3 chwiya b ydik, w tayb f mqla sokhna 3–4 d9aye9 l kol jiha 7tta y7mar."],"rziza":["3jen d9i9, smida w mel7a b lma 15 d9i9a 7tta tweli l3jina rteba bezzaf.","9ssemha koriyat, dhenhom b zit w khellihom yrta7o 20 d9i9a.","Fred koura 7tta tweli r9i9a bhal lkaghet, dhenha b zebda dayba, twiha 7bel w jebdo 7tta yweli khit r9i9.","Lffo 3la sbe3ek bhal lkobba d lkhit, w fredha chwiya.","Tayb f mqla 3la nar hadya 4–5 d9aye9 l kol jiha, w 9 /* Search matches the food name in every language, so a French word still finds the item while the app is in Darija */
/* Normalises Darija/Arabizi spellings so "tfah", "tfa7" and "Tfaha" match, "qar3a" finds "9ar3a", "adas" finds "3des" */
function norm(x){return String(x).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[\u064b-\u0652]/g,'')
  .replace(/7/g,'h').replace(/[3e]/g,'a').replace(/9|q|g/g,'k').replace(/2/g,'').replace(/5/g,'kh').replace(/ou|o/g,'u').replace(/[iy]/g,'i').replace(/[^a-z0-9\u0600-\u06ff ]/g,' ')
  .replace(/(.)\1+/g,'$1').replace(/\s+/g,' ').trim()}
/* vowels are written many ways in Darija, so a word also matches on its consonants alone (3+ letters) */
const skel=x=>x.replace(/[aiu]/g,'');
const nmatch=(hay,q)=>{const h=norm(hay),hs=skel(h);return norm(q).split(' ').every(w=>h.includes(w)||(skel(w).length>=3&&hs.includes(skel(w))))};

/* ---------- Weekly menu ----------
 The user gives people, budget, max time and exclusions; the app fills 7 days (ftour, ghda, 3cha).
 Generation tries a few hundred random weeks and keeps the best: no recipe twice, varied protein day to day,
 within budget when one is set. Couscous on Friday when the time limit allows it. Every meal can be swapped. */
const TAGS={meat:['l7em_3dem','lhem','kefta','l7em_ras','douwara','kour3in','kebda_ghanmi','mkh','ti7al','gueddid','kachir'],
  chicken:['djaj_kamel','sder','fkhad','kebda','kefta_d'],fish:['7out_kamel','sardine','merla','ton','ton_ma','9imroun','calamar','bbouzroug'],
  dairy:['hlib','lben','perly','jben','fromage','fromage_rouge','zebda','smen','nestle'],egg:['bid','bid_beldi'],
  gluten:['d9i9','d9i9_kamel','smida','couscous_n','makarona_n','makarona','cha3riya','berkoukech','khobz','khobz_b','lwr9a','herbel','belboula','msemen','harcha','choufan']};
const EXCL=['veg','meat','chicken','fish','dairy','egg','gluten'];
const FTOUR=[['fc_oil',[['khobz',.25],['zit_z',1],['atay',1]]],['fc_egg',[['khobz',.25],['bid',2],['atay',1]]],['fc_jben',[['khobz',.25],['jben',2],['l3sel',1],['r_9hwa_7lib',1]]],
  ['fc_oat',[['choufan',60],['hlib',1],['banan',1]]],['fc_amlou',[['khobz',.25],['amlou',1],['atay',1]]]];
const recMeta=r=>{const m=REC_META[r.key]||[];const slots=r.slots||m[2]||({main:'LD',fish:'LD',soup:'D',bread:'B',street:'D'}[r.cat]||'X');return {time:+r.time||m[0]||60,diff:+r.diff||m[1]||2,slots}};
function itemIds(items){const out=[];items.forEach(([id])=>{const r=id.startsWith&&id.startsWith('r_')?recipe(id):null;if(r)r.items.forEach(([i])=>out.push(i));else out.push(id)});return out}
function hasTag(ids,tag){const set=TAGS[tag];return ids.some(i=>set.includes(i))}
function okByExcl(ids,ex){if(ex.includes('veg')&&(hasTag(ids,'meat')||hasTag(ids,'chicken')||hasTag(ids,'fish')))return false;return ex.every(e=>e==='veg'||!hasTag(ids,e))}
const protOf=r=>{const ids=itemIds(r.items);return hasTag(ids,'fish')?'fish':hasTag(ids,'chicken')?'chicken':hasTag(ids,'meat')?'meat':'veg'};
const recCost=r=>recipeFood(r).p;
/* share of calories coming from protein */
const pDens=items=>{const m=sum(items);return m.k?m.p*4/m.k:0};
function menuPools(set){
  const ok=r=>{const m=recMeta(r);return (set.time>=999||m.time<=set.time)&&okByExcl(itemIds(r.items),set.excl)};
  const by=sl=>(S.recipes||[]).filter(r=>recMeta(r).slots.includes(sl)&&ok(r));
  return {L:by('L'),D:by('D'),B:by('B'),F:by('F'),ftour:FTOUR.filter(([,it])=>okByExcl(itemIds(it),set.excl))}}
const pick=a=>a[Math.floor(Math.random()*a.length)];
/* Breakfast recipes are often counted per piece (one beghrir, one msemen): serve enough pieces for ~350 kcal */
const bQty=r=>{const k=recipeFood(r).m[0]||300;return Math.max(1,Math.min(4,Math.round(350/k)))};
const BUDGET_W=100;
/* Household portions of lunch+dinner on menu day i for a candidate day, before the menu exists: same rule as
   dayFit/menuTotal (each eater's portion sized to calories). Eaters on another phone of the shared home count one
   portion each, since their sizes are not known for new dishes. Used to cost a week like the Menu tab and the list. */
function portionEst(set){const pr=P(),mc={},fc={},Z={k:0,cost:0};
  const M=id=>id?(mc[id]||(mc[id]=sum([[id,1]]))):Z,FT=it=>{if(!it)return Z;const k=JSON.stringify(it);return fc[k]||(fc[k]=sum(it))};
  const eat=S.profiles.filter(p=>!p.example&&!p.noTargets),etg=eat.map(p=>[0,1,2,3,4,5,6].map(i=>targets(p,i))),ptg=[0,1,2,3,4,5,6].map(i=>targets(pr,i));
  const remote=isObj(S.portions)?Object.keys(S.portions).filter(id=>!eat.some(p=>p.id===id)).length:0;
  const sugOf=(tg,ftk,mk)=>Math.max(.5,Math.min(2.5,Math.round((tg.kcal-ftk)/mk*4)/4));
  const por=(d,i)=>{const mk=M(d.ghda).k+M(d['3cha']).k;if(!mk)return set.people;const ftk=FT(d.ftour).k;
    if(!eat.length)return set.people-1+(pr.noTargets?1:sugOf(ptg[i],ftk,mk));
    return etg.reduce((s,tg)=>s+sugOf(tg[i],ftk,mk),0)+remote+Math.max(0,set.people-eat.length-remote)};
  const cost=(d,i)=>(M(d.ghda).cost+M(d['3cha']).cost)*por(d,i)+FT(d.ftour).cost*set.people;
  return {M,FT,por,cost}}
/* Cheapest week the recipes allow with no dish twice, costed with the household's portions: the realistic floor of a budget */
function menuMinCost(set){const pl=menuPools(set),uniq=a=>a.filter((r,i)=>a.indexOf(r)===i),E=portionEst(set);
  const cheap=a=>a.slice().sort((x,y)=>recCost(x)-recCost(y));
  const L=set.meals.ghda?cheap(pl.L.length>=7?pl.L:uniq(pl.L.concat(pl.D))):[],D=set.meals['3cha']?cheap(pl.D.length>=7?pl.D:uniq(pl.D.concat(pl.L))):[];
  const F=set.meals.ftour?pl.ftour.map(([,it])=>it).sort((a,b)=>E.FT(a).cost-E.FT(b).cost)[0]:null;let c=0;
  for(let i=0;i<7;i++){const g=L.length?L[i%L.length]:null;let n=D.length?D[i%D.length]:null;if(g&&n&&g.id===n.id&&D.length>1)n=D[(i+1)%D.length];
    c+=E.cost({ghda:g&&g.id,'3cha':n&&n.id,ftour:F},i)}
  return c}
function genWeek(set){
  const pl=menuPools(set);

  const custom=(Array.isArray(o.custom)?o.custom:[]).filter(f=>isObj(f)&&typeof f.id==='string'&&OKID.test(f.id)&&typeof f.n==='string'&&f.n.trim()&&MU[f.mu]&&Array.isArray(f.m)&&f.m.length===4&&f.m.every(x=>Number.isFinite(+x)&&+x>=0&&+x<2e4)&&Number.isFinite(+f.p)&&+f.p>=0&&+f.p<1e6);
  const cids=new Set(custom.map(f=>f.id));
  const days=o.days.filter(d=>isObj(d)&&typeof d.key==='string'&&typeof d.name==='string'&&d.name.trim()&&isObj(d.meals)).slice(0,14).map(d=>{const m={};
    Object.keys(d.meals).forEach(k=>{if(OKID.test(k))m[k]=cleanList(d.meals[k]).filter(([id])=>food(id)||cids.has(id))});return {key:d.key,name:d.name.trim().slice(0,40),meals:m}});
  if(!days.length)return null;
  const week=(Array.isArray(o.week)?o.week:[]).slice(0,7);
  const train=Array.isArray(o.train)?[...new Set(o.train.map(Number).filter(x=>Number.isInteger(x)&&x>=0&&x<7))]:null;
  return {name:typeof o.name==='string'?o.name.trim().slice(0,60):'',meals,custom,days,week,train,newFoods:custom.filter(f=>!S.custom.some(c=>sameName(c.n,f.n))).length}}
function progApply(pr){try{localStorage.setItem(KEY_PREV,JSON.stringify(S))}catch(e){}
  const p=P(),fmap={},dmap={};
  pr.custom.forEach(f=>{const ex=S.custom.find(c=>sameName(c.n,f.n));if(ex){fmap[f.id]=ex.id;return}
    const M=MU[f.mu];const nf={id:'c_'+uid(),n:f.n.trim().slice(0,60),cat:CAT_KEYS.includes(f.cat)?f.cat:'extra',mu:f.mu,u:M.u,gu:M.gu||null,ul:M.ul||'7ba',bl:M.bl||'7ba',b:M.b,f:M.f,d:M.d,s:M.s,m:f.m.map(Number),p:+f.p};
    S.custom.push(nf);fmap[f.id]=nf.id});

/* ---------- Shared household ("dar") sync over the Firestore REST API, no accounts ----------
 One document per household: households/<code>. The code (28 random characters) is the only key: the security rules
 allow get/create/update on a document whose id is ≥24 characters and forbid listing, so only people holding the code
 can read or write it.
 The shared part of the data is cut into small keys (one menu day, one recipe, one ticked item, one price…). Each key
 is stored as e.<key> = {v: JSON text, t: server time, by: member}. A device sends only the keys that changed since the
 last sync (updateMask), so two people editing different things never overwrite each other; on the same key the last
 write wins. What is shared: menu, recipes, favourites, shopping ticks, "at home", prices, own foods, spending, budget,
 oil, meal names, and only the profiles marked as shared. Language, theme and the active profile stay per phone.
 Changes are kept locally while offline and sent when the connection returns. Data received is passed through
 normalize() like an import. */
const FB={key:'AIzaSyC6tJDVO5qzuo27JXYmS1HAaGpKLtxorGw',project:'makla-mizan'};
const SYNC_DOC_BASE=`projects/${FB.project}/databases/(default)/documents`;
const syncApi=()=>{try{const o=localStorage.getItem('makla_sync_api');if(o)return o}catch(e){}return 'https://firestore.googleapis.com/v1/'+SYNC_DOC_BASE};
const SYNC_KNOWN=new Set(['meals','budget','oil','menuSet','menu','mday','recipe','fav','checked','pantry','price','ov','custom','spend','profile','portion']);
const SYNC_VER=2;
const SYNC_KEY=KEY+'_sync', SYNC_COLORS=['#2f8f5b','#2f6fbf','#c2572b','#8a4fbf','#b8860b','#c23b6a'];
let SY=null,_syncBusy=false,_syncAgain=false,_syncState='',_syncErr='',_syncTimer=null,_syncLast=0;
function syncLoad(){try{const o=JSON.parse(localStorage.getItem(SYNC_KEY)||'null');if(isObj(o)&&typeof o.hid==='string'&&/^[A-Za-z0-9]{24,40}$/.test(o.hid)&&isObj(o.me)){SY=Object.assign({base:{},attr:{},members:{},upd:''},o)}}catch(e){SY=null}
  if(SY&&(SY.ver||1)<SYNC_VER){const mine=new Set(S.profiles.map(p=>p.id));Object.keys(SY.base).forEach(k=>{if(k.startsWith('portion.')&&!mine.has(k.slice(8)))delete SY.base[k]});SY.upd='';SY.ver=SYNC_VER;syncSave()}}

const syncEnc=k=>'k'+k.replace(/_/g,'_u').replace(/\./g,'_d').replace(/-/g,'_h');
const syncDec=f=>f.slice(1).replace(/_d/g,'.').replace(/_h/g,'-').replace(/_u/g,'_');

  (S.recipes||[]).forEach(r=>o['recipe.'+r.id]=r);(S.fav||[]).forEach(id=>o['fav.'+id]=1);

/* puts one received key into S (v === undefined: deleted) */
function syncApply(k,v){const dot=k.indexOf('.'),pre=dot<0?k:k.slice(0,dot),id=dot<0?'':k.slice(dot+1);
  const upsert=(arr,x)=>{const i=arr.findIndex(y=>y.id===id);if(v===undefined){if(i>=0)arr.splice(i,1)}else if(isObj(x)){x.id=id;if(i>=0)arr[i]=x;else arr.push(x)}};
  const setIn=(obj,val)=>{if(v===undefined)delete obj[id];else obj[id]=val};
  switch(pre){
    case 'meals':if(Array.isArray(v))S.meals=v;break;
    case 'budget':S.budget=v===undefined?'':v;break;
    case 'oil':S.oil=v===undefined?1:v;break;
    case 'menuSet':if(v===undefined)delete S.menuSet;else S.menuSet=v;break;
    case 'menu':if(v===undefined){S.menu=null}else if(isObj(v)){if(!isObj(S.shop))S.shop={};if(S.shop.menu==null||!S.menu)S.shop.menu=true;if(!S.menu)S.menu={set:v.set,days:[{},{},{},{},{},{},{}],at:v.at};else{S.menu.set=v.set;S.menu.at=v.at}}break;
    case 'mday':{const i=+id;if(!(i>=0&&i<7))break;if(!S.menu){if(v===undefined)break;S.menu={set:S.menuSet||defaultSet(),days:[{},{},{},{},{},{},{}],at:0}}S.menu.days[i]=v===undefined?{}:v;break}
    case 'recipe':upsert(S.recipes,v);break;
    case 'fav':{if(!Array.isArray(S.fav))S.fav=[];const i=S.fav.indexOf(id);if(v===undefined){if(i>=0)S.fav.splice(i,1)}else if(i<0)S.fav.push(id);break}
    case 'portion':if(!isObj(S.portions))S.portions={};if(S.profiles.some(p=>p.id===id))break;setIn(S.portions,v);break;
    case 'checked':setIn(S.checked,true);break;
    case 'pantry':setIn(S.pantry,v);break;
    case 'price':setIn(S.prices,v);break;
    case 'ov':setIn(S.ov,v);break;
    case 'custom':upsert(S.custom,v);break;
    case 'spend':upsert(S.spend,v);break;
    case 'profile':{const i=S.profiles.findIndex(p=>p.id===id);if(v===undefined){if(i>=0)delete S.profiles[i].shared}
      else if(isObj(v)){v.id=id;v.shared=true;if(i>=0)S.profiles[i]=v;else S.profiles.push(v)}break}
  }}
/* Firestore values */
const fsStr=s=>({stringValue:String(s)});
const fsVal=x=>x==null?null:x.stringValue!=null?x.stringValue:x.integerValue!=null?+x.integerValue:x.doubleValue!=null?x.doubleValue:x.timestampValue!=null?Date.parse(x.timestampValue):x.mapValue?Object.fromEntries(Object.entries(x.mapValue.fields||{}).map(([k,y])=>[k,fsVal(y)])):null;
async function syncFetch(url,opt){const sep=url.includes('?')?'&':'?';const r=await fetch(url+sep+'key='+FB.key,Object.assign({cache:'no-store'},opt||{}));
  if(r.status===404)return null;const j=await r.json().catch(()=>({}));if(!r.ok){const e=new Error((j.error&&j.error.status)||('HTTP '+r.status));e.status=r.status;throw e}return j}
function syncMemberFields(){return {n:fsStr(SY.me.n),c:fsStr(SY.me.c)}}
async function syncPush(){const snap=syncSnap(),changed=[];
  const json={};Object.keys(snap).forEach(k=>{json[k]=JSON.stringify(snap[k]===undefined?null:snap[k]);if(SY.base[k]!==json[k])changed.push(k)});
  Object.keys(SY.base).forEach(k=>{if(!(k in snap)&&SY.base[k]!=='null'){json[k]='null';changed.push(k)}});
  const beat=Date.now()-(SY.beat||0)>5*60e3;
  if(!changed.length&&!beat)return 0;
  const fields={},paths=[],tr=[];
  changed.slice(0,400).forEach(k=>{const f=syncEnc(k);fields[f]={mapValue:{fields:{v:fsStr(json[k]),by:fsStr(SY.me.id)}}};paths.push('e.'+f+'.v','e.'+f+'.by');tr.push({fieldPath:'e.'+f+'.t',setToServerValue:'REQUEST_TIME'})});
  const doc={e:{mapValue:{fields}},members:{mapValue:{fields:{[SY.me.id]:{mapValue:{fields:syncMemberFields()}}}}}};
  paths.push('members.'+SY.me.id+'.n','members.'+SY.me.id+'.c');tr.push({fieldPath:'members.'+SY.me.id+'.t',setToServerValue:'REQUEST_TIME'});
  const body=JSON.stringify({writes:[{update:{name:SYNC_DOC_BASE+'/households/'+SY.hid,fields:doc},updateMask:{fieldPaths:paths},updateTransforms:tr}]});
  if(body.length>900000)throw Object.assign(new Error('TOO_BIG'),{status:413});
  const res=await syncFetch(syncApi()+':commit',{method:'POST',headers:{'Content-Type':'application/json'},body});
  const t=res&&res.commitTime?Date.parse(res.commitTime):Date.now();
  changed.slice(0,400).forEach(k=>{SY.base[k]=json[k];SY.attr[k]={by:SY.me.id,t}});SY.beat=Date.now();syncSave();
  return changed.length>400?_syncAgain=true:changed.length}
async function syncPull(force){const doc=await syncFetch(syncApi()+'/households/'+SY.hid);if(!doc)return [];
  if(!force&&doc.updateTime&&doc.updateTime===SY.upd)return [];
  const F=doc.fields||{},E=(F.e&&F.e.mapValue&&F.e.mapValue.fields)||{};
  SY.members=fsVal(F.members)||{};
  const snapJson={};Object.entries(syncSnap()).forEach(([k,v])=>snapJson[k]=JSON.stringify(v));
  const got=[];
  Object.entries(E).forEach(([f,x])=>{const k=syncDec(f),e=fsVal(x)||{};if(typeof e.v!=='string'||!SYNC_KNOWN.has(k.split('.')[0]))return;
    if(e.by)SY.attr[k]={by:e.by,t:e.t||0};
    if(SY.base[k]===e.v)return;
    const local=k in snapJson?snapJson[k]:'null',pending=SY.base[k]!==undefined?local!==SY.base[k]:false;
    if(pending&&!force)return;
    let val;try{val=JSON.parse(e.v)}catch(_){return}
    if(local!==e.v){syncApply(k,val===null?undefined:val);if(e.by!==SY.me.id)got.push(k)}
    SY.base[k]=e.v});
  if(got.length){const prev=S;try{S=JSON.parse(JSON.stringify(S));_fixes=0;normalize();_foods=null}catch(e){S=prev;console.error(e)}migratePf();migrateXtra();
    /* keep what normalize produced as the synced value, so it is not sent back as a change */
    const after=syncSnap();got.forEach(k=>{if(k in after)SY.base[k]=JSON.stringify(after[k])})}
  SY.upd=doc.updateTime||'';syncSave();return got}
async function syncNow(force){if(!SY)return;if(_syncBusy){_syncAgain=true;return}_syncBusy=true;
  try{if(force)await syncPull(true);await syncPush();const got=await syncPull(false);_syncState='ok';_syncErr='';_syncLast=Date.now();
    if(got.length){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}_foods=null;render();
      const by={};got.forEach(k=>{const a=SY.attr[k];if(a&&a.by!==SY.me.id)by[a.by]=(by[a.by]||0)+1});
      const who=Object.keys(by).map(id=>(SY.members[id]&&SY.members[id].n)||'?');if(who.length)toast(t('sync_got',{n:who.join(', '),x:got.length}))}}
  catch(e){_syncState=navigator.onLine===false||e instanceof TypeError?'off':'err';_syncErr=e.status===403?'rules':e.status===413?'big':'';console.warn('sync',e)}
  finally{_syncBusy=false;syncBadge();if(tab==='reglages'&&!document.activeElement.closest('#darBox'))renderDarBox();if(_syncAgain){_syncAgain=false;setTimeout(()=>syncNow(),300)}}}
function syncSoon(){if(!SY)return;clearTimeout(_syncTimer);_syncTimer=setTimeout(()=>syncNow(),1200)}
function syncPending(){if(!SY)return 0;const s=syncSnap();let n=0;Object.keys(s).forEach(k=>{if(SY.base[k]!==JSON.stringify(s[k]))n++});Object.keys(SY.base).forEach(k=>{if(!(k in s)&&SY.base[k]!=='null')n++});return n}
setInterval(()=>{if(SY&&document.visibilityState==='visible')syncNow()},8000);
document.addEventListener('visibilitychange',()=>{if(SY&&document.visibilityState==='visible')syncNow()});
window.addEventListener('online',()=>syncNow());
function syncBadge(){const el=document.getElementById('syncDot');if(!el)return;if(!SY){el.hidden=true;return}el.hidden=false;
  const st=_syncState==='ok'&&syncPending()?'wait':(_syncState||'wait');el.className='syncdot '+st;const l=t('sync_st_'+st);el.title=l;el.setAttribute('aria-label',l)}
const agoTxt=ms=>{const m=Math.round((Date.now()-ms)/60000);return m<1?t('ago_now'):m<60?t('ago_m',{n:m}):m<1440?t('ago_h',{n:Math.round(m/60)}):t('ago_d',{n:Math.round(m/1440)})};

function syncMark(k){if(!SY)return '';const a=SY.attr[k];if(!a||a.by===SY.me.id||Date.now()-a.t>48*3600e3)return '';
  const m=SY.members[a.by]||{};const c=/^#[0-9a-f]{6}$/i.test(m.c)?m.c:'#888';const lab=esc((m.n||'?')+' · '+agoTxt(a.t));
  return `<i class="sdot" style="background:${c}" title="${lab}" aria-label="${lab}" role="img"></i>`}
const genCode=()=>{const a='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789';const b=new Uint8Array(28);crypto.getRandomValues(b);return [...b].map(x=>a[x%a.length]).join('')};
let darForm={n:'',c:SYNC_COLORS[0],code:''};
function darMe(){const n=(document.getElementById('darName')||{}).value;const name=String(n||darForm.n||'').trim().slice(0,30);if(!name){const e=document.getElementById('darName');e&&e.focus();return null}

  const msg=document.getElementById('darMsg');if(!/^[A-Za-z0-9]{24,40}$/.test(code)){if(msg)msg.textContent=t('dar_badcode');return}

  if(!SY){return `<p class="hint">${t('dar_intro')}</p>
    <div class="grid"><div><label class="lbl" for="darName">${t('dar_name')}</label><input id="darName" class="in" maxlength="30" value="${esc(darForm.n)}" oninput="darForm.n=this.value"></div>
