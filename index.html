<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="mobile-web-app-capable" content="yes">

<link rel="manifest" href="manifest.webmanifest">

<title>Makla & Mizan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Soft UI (neumorphism): surfaces share the page colour and are lifted or pressed with paired light/dark shadows; one deep-teal accent */
:root{
  --bg:#ece5da; --surface:#ece5da; --sunk:#e3dbcf; --line:#d6ccbd;
  --ink:#1f2a2b; --muted:#6e6a62;
  --accent:#0f5257; --accent-ink:#ffffff; --accent-soft:#dfe6e1;
  --money:#8f5f14; --money-soft:#e7dccb;
  --p:#2c7a5c; --c:#b07f12; --f:#b2474f; --kcal:#bf5f26;
  --danger:#b2363f;
  --hi:rgba(255,255,255,.85); --lo:rgba(163,146,120,.55);
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#252a2c; --surface:#252a2c; --sunk:#1f2325; --line:#343a3d;
  --ink:#e9e6df; --muted:#a19d94;
  --accent:#5fb8b2; --accent-ink:#10292a; --accent-soft:#2c3537;
  --money:#e2b25a; --money-soft:#2e2b24;
  --p:#5fc79a; --c:#e0b448; --f:#ec7a82; --kcal:#ee9356; --danger:#ef7b82;
  --hi:rgba(255,255,255,.06); --lo:rgba(0,0,0,.55);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#252a2c; --surface:#252a2c; --sunk:#1f2325; --line:#343a3d;
  --ink:#e9e6df; --muted:#a19d94;
  --accent:#5fb8b2; --accent-ink:#10292a; --accent-soft:#2c3537;
  --money:#e2b25a; --money-soft:#2e2b24;
  --p:#5fc79a; --c:#e0b448; --f:#ec7a82; --kcal:#ee9356; --danger:#ef7b82;
  --hi:rgba(255,255,255,.06); --lo:rgba(0,0,0,.55);
  color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;padding-top:env(safe-area-inset-top,0px)}
#installBtn[hidden]{display:none}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 80px}
.wrap{max-width:960px;margin:0 auto}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:18px 10px}
.brand h1{font-size:26px;font-weight:800;letter-spacing:-.02em}
.brand p{margin:0;color:var(--muted);font-size:13px}
.who{display:flex;align-items:center;gap:8px}
.who select{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-weight:600}

nav.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:999px;margin-block:6px 18px;overflow-x:auto;
  position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
nav.tabs button{flex:1;white-space:nowrap;border:0;background:transparent;padding:9px 14px;border-radius:999px;font-weight:600;color:var(--muted)}
nav.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.lbl{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px;letter-spacing:.02em}
.in{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.in:focus{border-color:var(--accent);outline:none}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec-h h2{font-size:19px}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 13px;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:5px 10px;font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:600;font-size:13.5px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.target{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tbox{background:var(--sunk);border-radius:10px;padding:10px}
.tbox b{display:block;font-family:var(--mono);font-size:20px}
.tbox span{font-size:12px;color:var(--muted)}
@media (max-width:520px){.target{grid-template-columns:repeat(2,1fr)}}

.bars{position:sticky;top:calc(env(safe-area-inset-top,0px) + 56px);z-index:15;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;grid-template-columns:1fr 1fr;gap:8px 18px}
.bar .t{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600}
.bar .t .num{font-size:12.5px}
.track{height:6px;background:var(--sunk);border-radius:6px;overflow:hidden;margin-top:4px}
.fill{height:100%;border-radius:6px}
.over .t .num{color:var(--danger)}
.bars .cost{grid-column:1/-1;display:flex;justify-content:space-between;border-top:1px dashed var(--line);padding-top:8px;font-size:13px}
.bars .cost b{color:var(--money)}

.meal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.meal-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.meal-h h3{font-size:16px}
.meal-h .m{font-size:12.5px;color:var(--muted)}
.items{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--sunk)}
.item:last-child{border-bottom:0}
.item .nm{font-weight:600;min-width:0}
.item .mm{font-size:12px;color:var(--muted)}
.mm .p{color:var(--p)} .mm .c{color:var(--c)} .mm .f{color:var(--f)} .mm .k{color:var(--kcal)}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.qty button{border:0;background:var(--sunk);width:30px;height:32px;font-weight:700}
.qty input{width:56px;border:0;text-align:center;background:transparent;height:32px;font-family:var(--mono)}
.qty small{padding-right:8px;color:var(--muted);font-size:11.5px;white-space:nowrap}
.price{font-family:var(--mono);font-size:13px;color:var(--money);text-align:right;min-width:62px}
.x{border:0;background:transparent;color:var(--muted);width:26px;height:26px;border-radius:6px}
.x:hover{color:var(--danger);background:var(--sunk)}
.empty{padding:16px 14px;color:var(--muted);font-size:13.5px}
@media (max-width:560px){.item{grid-template-columns:1fr auto}.item .price{grid-column:1;text-align:left}.item .x{grid-row:1;grid-column:2;justify-self:end}}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{background:var(--sunk);border-radius:10px;padding:8px}
.wd b{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.wd select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 4px;font-size:13px}
@media (max-width:700px){.week{grid-template-columns:repeat(2,1fr)}}

.receipt{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.receipt .grp{padding:8px 14px;background:var(--sunk);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.li{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--sunk)}
.li input{width:18px;height:18px;accent-color:var(--accent)}
.li.done .nm{text-decoration:line-through;color:var(--muted)}
.li .amt{font-family:var(--mono);font-weight:600}
.li .pr{font-family:var(--mono);color:var(--money);min-width:70px;text-align:right}
.tot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:14px;background:var(--money-soft)}
.tot div span{display:block;font-size:12px;color:var(--muted)}
.tot div b{font-family:var(--mono);font-size:20px;color:var(--money)}

.ptable{display:flex;flex-direction:column}
.prow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--sunk)}
.prow .pi{display:flex;align-items:center;gap:6px}
.prow .pi input{width:84px;text-align:right;font-family:var(--mono)}
.prow small{color:var(--muted);font-size:12px;white-space:nowrap}

.note{background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:13.5px}
.warn{background:var(--money-soft);border-radius:10px;padding:10px 12px;font-size:13.5px}

.sheet-bg{position:fixed;inset:0;background:rgba(10,14,30,.45);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:18px 18px 0 0;max-height:82%;display:flex;flex-direction:column;
  padding:14px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-width:760px;margin:0 auto}
.sheet .list{overflow-y:auto;margin-top:10px;display:flex;flex-direction:column}
.fopt{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;text-align:left;border:0;border-bottom:1px solid var(--sunk);background:transparent;padding:10px 4px}
.fopt:hover{background:var(--sunk)}
.fopt .nm{font-weight:600}
.fopt .add{font-weight:700;color:var(--accent);font-size:20px;padding:0 8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13.5px;font-weight:600;z-index:60}
@media (prefers-reduced-motion:no-preference){.fill{transition:width .25s}}

/* ---- Soft UI layer ---- */
:root{--raise:6px 6px 14px var(--lo),-6px -6px 14px var(--hi);--raise-sm:3px 3px 7px var(--lo),-3px -3px 7px var(--hi);
  --press:inset 3px 3px 7px var(--lo),inset -3px -3px 7px var(--hi)}
.panel,.meal,.bars,.receipt{border:0;box-shadow:var(--raise);border-radius:var(--r)}
.meal-h{border-bottom:1px solid var(--line)}
.item,.li,.fopt,.prow{border-bottom-color:var(--line)}
.in,.who select,.wd select{border:0;background:var(--bg);box-shadow:var(--press);border-radius:12px}
.in:focus,.who select:focus{box-shadow:var(--press),0 0 0 2px var(--accent)}
nav.tabs{background:var(--bg);box-shadow:var(--press);padding:6px}
nav.tabs button[aria-selected="true"]{background:var(--bg);color:var(--accent);box-shadow:var(--raise-sm)}
.btn{border:0;background:var(--bg);box-shadow:var(--raise-sm);border-radius:12px;color:var(--ink)}
.btn:hover{border:0;color:var(--accent)}
.btn:active,.chip:active,.qty button:active{box-shadow:var(--press)}
.btn.pri{background:var(--accent);color:var(--accent-ink);box-shadow:var(--raise-sm)}
.btn.pri:hover{color:var(--accent-ink);filter:brightness(1.08)}
.btn.ghost{box-shadow:none;background:transparent}
.btn.danger{color:var(--danger)}
.chip{border:0;background:var(--bg);box-shadow:var(--raise-sm)}
.chip[aria-pressed="true"]{background:var(--bg);color:var(--accent);box-shadow:var(--press);border:0}
.tbox{background:var(--bg);box-shadow:var(--press);border-radius:14px}
.track{background:var(--bg);box-shadow:inset 2px 2px 4px var(--lo),inset -2px -2px 4px var(--hi);height:8px}
.qty{border:0;box-shadow:var(--press);border-radius:12px;background:var(--bg);width:max-content}
.qty button{background:transparent;color:var(--accent)}
.wd{background:var(--bg);box-shadow:var(--raise-sm);border-radius:14px}
.receipt .grp{background:var(--sunk)}
.tot{background:var(--sunk)}
.note,.warn{background:var(--bg);box-shadow:var(--press);border-radius:14px}
.note{border-left:3px solid var(--accent)}
.warn{border-left:3px solid var(--money)}
.sheet{background:var(--bg);box-shadow:0 -8px 24px var(--lo)}
.toast{background:var(--accent);color:var(--accent-ink);box-shadow:var(--raise-sm)}
.x:hover{background:var(--bg);box-shadow:var(--press)}
.brand h1{color:var(--accent)}

.mems{display:flex;flex-direction:column;gap:10px}
.mem{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;padding:10px;border-radius:14px;background:var(--bg);box-shadow:var(--raise-sm)}
.mem-n{display:flex;gap:8px;align-items:center;flex:1;min-width:0}
.mem-n input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.mem-n small{display:block;color:var(--muted);font-size:12px}
.mem-f{width:86px}
.mem .x{align-self:center}
.split{display:flex;flex-direction:column;gap:6px}
.split div{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.split b{color:var(--money)}
nav.tabs button{padding:9px 10px}
</style>
</head>

function normalize(){
  S.prices=S.prices||{}; S.custom=S.custom||[]; S.checked=S.checked||{};
  if(!S.house) S.house=sampleHouse();
  if(!S.shop) S.shop={house:true};
  S.profiles.forEach(p=>{if(p.eatsHouse==null)p.eatsHouse=false;if(p.hf==null)p.hf=p.sex==='f'?.85:1;if(S.shop[p.id]==null)S.shop[p.id]=true;delete p.checked});
}

  try{const r=localStorage.getItem(KEY); if(r){const o=JSON.parse(r); if(o&&o.profiles&&o.profiles.length){S=o;normalize();return;}}}catch(e){}
  const p=sampleProfile(); S={profiles:[p],active:p.id,prices:{},custom:[]}; normalize();
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const P=()=>S.profiles.find(p=>p.id===S.active)||S.profiles[0];
const H=()=>S.house;
const allFoods=()=>FOODS.concat(S.custom||[]);
const food=id=>allFoods().find(f=>f.id===id);
const price=f=>S.prices[f.id]!=null?S.prices[f.id]:f.p;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r1=x=>Math.round(x*10)/10, r0=x=>Math.round(x);
const r2=x=>Math.round(x*100)/100;
const dh=x=>x.toFixed(2)+' DH';

/* ---------- Maths ---------- */
function targets(p){
  const bmr=10*p.w+6.25*p.h-5*p.age+(p.sex==='m'?5:-161);
  const tdee=bmr*p.act; const g=GOALS[p.goal];
  const kcal=Math.round(tdee*g[1]);
  const pk=p.protKg||g[2]; const prot=Math.round(p.w*pk);
  const fat=Math.round(p.w*(p.fatKg||.9));
  const carbs=Math.max(0,Math.round((kcal-prot*4-fat*9)/4));
  return {bmr:Math.round(bmr),tdee:Math.round(tdee),kcal,prot,fat,carbs,pk};
}
function itemM(fid,q){
  const f=food(fid); if(!f) return {k:0,p:0,c:0,f:0,cost:0};
  const mul=f.u==='g'?q/100:q;
  return {k:f.m[0]*mul,p:f.m[1]*mul,c:f.m[2]*mul,f:f.m[3]*mul,cost:q*f.f*price(f)};
}
function sum(list){const t={k:0,p:0,c:0,f:0,cost:0};list.forEach(([id,q])=>{const m=itemM(id,q);for(const k in t)t[k]+=m[k]});return t;}
const dayTot=d=>d?sum(MEALS.flatMap(([k])=>d.meals[k]||[])):{k:0,p:0,c:0,f:0,cost:0};
const addT=(a,b,x=1)=>{const t={};for(const k in a)t[k]=a[k]+b[k]*x;return t;};
/* How many adult-man portions of the shared food the household cooks */
function houseFactor(){
  return r2(H().members.reduce((s,m)=>s+(+m.f||0),0)+S.profiles.filter(p=>p.eatsHouse).reduce((s,p)=>s+(+p.hf||0),0));
}
const hDay=id=>H().days.find(d=>d.id===id);

/* ---------- Editing context: the Ayyam tab edits the profile, the Dar tab edits the household ---------- */
const ctxHouse=()=>tab==='dar';

  if(!H().days.find(d=>d.id===curHDay)) curHDay=H().days[0]&&H().days[0].id;

  v.innerHTML=({profil:vProfil,ayyam:vAyyam,simana:vSimana,dar:vDar,t9edya:vT9edya,prix:vPrix}[tab])(p);
}

function upd(k,v){const p=P();p[k]=v;if(['w','h','age','sex','act','goal','name'].includes(k))p.example=false;save();render()}
function newProfile(){const d={id:uid(),name:'Nhar A',meals:emptyMeals()};

function delProfile(){if(delArm!=='p'){delArm='p';render();return}delete S.shop[S.active];S.profiles=S.profiles.filter(x=>x.id!==S.active);S.active=S.profiles[0].id;delArm=null;save();render();toast('Profil tmse7')}

function bar(lbl,v,t,col,warnOver=true){const pct=t?Math.min(100,v/t*100):0;const over=warnOver&&v>t*1.05;
  return `<div class="bar ${over?'over':''}"><div class="t"><span>${lbl}</span><span class="num">${r0(v)} / ${t}</span></div><div class="track"><div class="fill" style="width:${pct}%;background:${col}"></div></div></div>`}
function bars4(tot,t,suffix=''){return bar('Calories'+suffix,tot.k,t.kcal,'var(--kcal)')+bar('Protein'+suffix,tot.p,t.prot,'var(--p)',false)+bar('Karb',tot.c,t.carbs,'var(--c)')+bar('Dhoun',tot.f,t.fat,'var(--f)')}

function dayHeader(container,cur,label){

  if(!d) return `<div class="panel"><p>Ma kayn 7ta nhar.</p><button class="btn pri" onclick="newDay()">+ Nhar jdid</button></div>`;
  let tot=dayTot(d); const hd=p.eatsHouse?hDay(d.hp):null;
  if(hd) tot=addT(tot,dayTot(hd),p.hf);
  const ownCost=dayTot(d).cost;
  return `<div class="stack">
  <p class="hint">${p.eatsHouse?'Nta katakol m3a dar: 7et hna ghir <b>l\'extras dyalek</b> (whey, djaj zayd…). L\'makla mechtarka kayna f l\'onglet "Dar".':'Sawb 2–3 d les ayyam "template" (b7al nhar training w nhar raha), w men ba3d 3tihom l ayyam simana f l\'onglet "Simana".'}</p>

function vMeal(d,k,l,mult){
  const list=d.meals[k]||[]; const t=sum(list); const fam=mult!==1;
  const rows=list.map(([id,q],i)=>{const f=food(id); if(!f) return ''; const m=itemM(id,q);
    const famQ=fam?`<div class="mm">Dar kamla: <b class="num">${f.u==='g'?r0(q*mult)+' g':r1(q*mult)+' '+esc(f.ul)}</b></div>`:'';
    return `<div class="item">
      <div style="min-width:0"><div class="nm">${esc(f.n)}</div>
      <div class="mm num"><span class="k">${r0(m.k)} kcal</span> · <span class="p">P ${r1(m.p)}</span> · <span class="c">K ${r1(m.c)}</span> · <span class="f">D ${r1(m.f)}</span></div>${famQ}</div>
      <div class="qty"><button aria-label="N9es" onclick="step('${k}',${i},-1)">−</button>
        <input id="q_${fam?'h':'p'}_${k}_${i}" type="number" inputmode="decimal" min="0" step="${f.s}" value="${q}" aria-label="Kmiya" onchange="setQ('${k}',${i},this.value)">
        <small>${f.u==='g'?'g':esc(f.ul)}</small><button aria-label="Zid" onclick="step('${k}',${i},1)">+</button></div>
      <div class="price">${dh(m.cost*mult)}</div>
      <button class="x" aria-label="7ayed" onclick="rmItem('${k}',${i})">✕</button>
    </div>`}).join('');
  return `<section class="meal"><div class="meal-h"><div><h3>${l}</h3><div class="m num">${fam?'L wa7ed: ':''}${r0(t.k)} kcal · P ${r0(t.p)} g · ${fam?'Dar: ':''}${dh(t.cost*mult)}</div></div>
    <button class="btn sm pri" onclick="openSheet('${k}')">+ Zid makla</button></div>
    <div class="items">${rows||`<div class="empty">Khawya. Brk 3la "Zid makla".</div>`}</div></section>`;
}
function setQ(k,i,v){D().meals[k][i][1]=Math.max(0,parseFloat(v)||0);clearEx();save();render()}
function step(k,i,dir){const it=D().meals[k][i];const f=food(it[0]);it[1]=Math.max(0,r1(it[1]+dir*f.s));clearEx();save();render()}
function rmItem(k,i){D().meals[k].splice(i,1);clearEx();save();render()}

function delDay(){if(delArm!=='d'){delArm='d';render();return}const c=box();const id=D().id;c.days=c.days.filter(x=>x.id!==id);c.week=c.week.map(w=>w===id?(c.days[0]?c.days[0].id:null):w);
  if(ctxHouse())S.profiles.forEach(p=>p.days.forEach(d=>{if(d.hp===id)d.hp=null}));

    <div class="sec-h"><h2 style="font-size:18px">Zid l ${ml}${ctxHouse()?' (dar)':''}</h2><button class="btn sm" onclick="closeSheet()">Sali</button></div>
    <input id="sQ" class="in" style="margin-top:10px" placeholder="9elleb: bid, sardine, 3des…" value="${esc(sheetQ)}" oninput="sheetQ=this.value;renderSheetList()">
    <div class="chips" style="margin-top:10px">${[['all','Kolchi']].concat(Object.entries(CATS)).map(([k,l])=>`<button class="chip" aria-pressed="${sheetCat===k}" onclick="sheetCat='${k}';renderSheet()">${l}</button>`).join('')}</div>
    <div class="list" id="sList"></div></div>`;
  renderSheetList();
}
function renderSheetList(){
  const q=sheetQ.toLowerCase().trim();
  const list=allFoods().filter(f=>(sheetCat==='all'||f.cat===sheetCat)&&(!q||f.n.toLowerCase().includes(q)));
  document.getElementById('sList').innerHTML=list.length?list.map(f=>`<button class="fopt" onclick="addFood('${f.id}')">
    <span><span class="nm">${esc(f.n)}</span><br><span class="mm num" style="font-size:12px;color:var(--muted)">${f.u==='g'?'100 g':'1 '+esc(f.ul)}: ${f.m[0]} kcal · P ${f.m[1]} · K ${f.m[2]} · D ${f.m[3]}</span></span>
    <span class="add">+</span></button>`).join(''):`<p class="hint" style="padding:12px 0">Ma l9it walo. Zid makla dyalek f l'onglet "Prix".</p>`;
}
function addFood(id){const f=food(id);const arr=D().meals[sheetMeal];const ex=arr.find(x=>x[0]===id);
  if(ex) ex[1]=r1(ex[1]+f.s); else arr.push([id,f.d]); clearEx(); save();render();toast(f.n+' tzad')}

/* ---------- Simana (one profile) ---------- */
function weekSelect(c,setter){
  return `<div class="week">${WEEK.map((w,i)=>`<div class="wd"><b>${w}</b><select id="${setter}${i}" aria-label="${w}" onchange="${setter}(${i},this.value)">${c.days.map(d=>`<option value="${d.id}" ${c.week[i]===d.id?'selected':''}>${esc(d.name)}</option>`).join('')}<option value="" ${!c.week[i]?'selected':''}>— walo</option></select></div>`).join('')}</div>`;
}
function vSimana(p){
  const t=targets(p); const avg={k:0,p:0,c:0,f:0}; let own=0;
  WEEK.forEach((_,i)=>{const d=p.days.find(x=>x.id===p.week[i]);const dt=dayTot(d);own+=dt.cost;
    let tt=dt; if(p.eatsHouse) tt=addT(tt,dayTot(hDay(H().week[i])),p.hf);
    for(const k in avg)avg[k]+=tt[k]/7});
  return `<div class="stack">
  <section class="panel stack"><div class="sec-h"><h2>Simana dyal ${esc(p.name)}</h2><span class="hint">Khtar l'template dyal kol nhar</span></div>
    ${weekSelect(p,'setW')}
    <h3 style="font-size:15px">Moyenne dyal nhar${p.eatsHouse?' (m3a l\'makla dyal dar ×'+p.hf+')':''}</h3>
    <div class="bars" style="position:static">${bars4(avg,t,'')}
      <div class="cost"><span>${p.eatsHouse?'Extras dyalek f simana':'Taman dyal simana'}</span><b class="num">${dh(own)}</b></div></div>
    <p class="hint">Lista dyal t9edya kayna f l'onglet "T9edya", w katjme3 ga3 nass dyal dar.</p>
  </section></div>`;
}
function setW(i,v){P().week[i]=v||null;save();render()}

/* ---------- Dar (household) ---------- */
function vDar(){
  const h=H(); const tf=houseFactor(); const d=D();
  const typeOpts=cur=>TYPES.map(([k,l,f])=>`<option value="${k}" ${cur===k?'selected':''}>${l} (×${f})</option>`).join('');
  const dt=d?dayTot(d):null;
  return `<div class="stack">
  ${h.example?`<div class="note">Hadchi <b>mital</b>. Beddel nass dyal dar w l'makla dyalkom.</div>`:''}
  <section class="panel stack">
    <div class="sec-h"><h2>Nass dyal dar</h2><span class="hint num">Dar = ${tf} portions d wa7ed kbir</span></div>
    <p class="hint">Kol wa7ed 3ando "portion": ch7al kayakol m9arna m3a rajel kbir (1). Hadchi ta9ribi 3la 7sab l'7ajat dyal l'ta9a; beddlou ila bghiti.</p>
    <div class="mems">
      ${S.profiles.map(p=>`<div class="mem">
        <label class="mem-n"><input type="checkbox" ${p.eatsHouse?'checked':''} onchange="setPH('${p.id}','eatsHouse',this.checked)"> <span><b>${esc(p.name)}</b><small>profil · kayakol m3a dar</small></span></label>
        <div class="mem-f"><label class="lbl" for="hf_${p.id}">Portion</label><input id="hf_${p.id}" class="in num" type="number" step="0.05" min="0" max="2" value="${p.hf}" ${p.eatsHouse?'':'disabled'} onchange="setPH('${p.id}','hf',+this.value)"></div>
      </div>`).join('')}
      ${h.members.map(m=>`<div class="mem">
        <div class="mem-n" style="flex-wrap:wrap"><input id="mn_${m.id}" class="in" style="flex:1;min-width:110px" value="${esc(m.name)}" aria-label="Smiya" onchange="setM('${m.id}','name',this.value)">
          <select id="mt_${m.id}" class="in" style="flex:1;min-width:130px" aria-label="No3" onchange="setM('${m.id}','type',this.value)">${typeOpts(m.type)}</select></div>
        <div class="mem-f"><label class="lbl" for="mf_${m.id}">Portion</label><input id="mf_${m.id}" class="in num" type="number" step="0.05" min="0" max="2" value="${m.f}" onchange="setM('${m.id}','f',+this.value)"></div>
        <button class="x" aria-label="7ayed ${esc(m.name)}" onclick="rmM('${m.id}')">✕</button>
      </div>`).join('')}
    </div>
    <div class="row"><button class="btn sm" onclick="addM()">+ Zid wa7ed (bla profil)</button></div>
  </section>

  <section class="stack">
    <div class="sec-h"><h2>Makla dyal dar</h2></div>
    <p class="hint">Hna l'makla mechtarka (tajine, couscous, ftour dyal l3a2ila). 7et <b>l'kmiya dyal wa7ed kbir</b>, w l'app katdreb f ${tf} bach t3tik ch7al khassek tayb. L'extras dyal kol wa7ed 3ando profil kayt7etto f "Ayyam".</p>
    ${dayHeader(h,curHDay,'Makla')}
    ${d?`<div class="bars" style="position:static">
      <div class="bar"><div class="t"><span>L wa7ed kbir</span><span class="num">${r0(dt.k)} kcal</span></div></div>
      <div class="bar"><div class="t"><span>Protein</span><span class="num">${r0(dt.p)} g</span></div></div>
      <div class="cost"><span>Taman dyal nhar l dar kamla (×${tf})</span><b class="num">${dh(dt.cost*tf)}</b></div></div>
    ${MEALS.map(([k,l])=>vMeal(d,k,l,tf)).join('')}`:''}
  </section>

  <section class="panel stack"><div class="sec-h"><h2>Simana dyal dar</h2></div>
    ${weekSelect(h,'setHW')}
  </section></div>`;
}
function setHW(i,v){H().week[i]=v||null;save();render()}
function setPH(id,k,v){const p=S.profiles.find(x=>x.id===id);p[k]=v;save();render()}
function setM(id,k,v){const m=H().members.find(x=>x.id===id);m[k]=v;if(k==='type')m.f=TYPES.find(t=>t[0]===v)[2];H().example=false;save();render()}
function addM(){H().members.push({id:uid(),name:'Wa7ed jdid',type:'rajel',f:1});H().example=false;save();render()}
function rmM(id){H().members=H().members.filter(m=>m.id!==id);save();render()}

/* ---------- T9edya (whole household) ---------- */
function fmtAmt(f,x){
  if(f.b==='kg') return x>=1?r1(x)+' kg':Math.ceil(x*1000/10)*10+' g';
  if(f.b==='L') return x>=1?r1(x)+' L':Math.ceil(x*1000/10)*10+' ml';
  return Math.ceil(x-1e-9)+' '+(f.bl||'7ba');
}
function vT9edya(){
  const agg={}; const parts=[];
  const addDay=(d,mult)=>{let c=0;if(!d)return 0;MEALS.forEach(([k])=>(d.meals[k]||[]).forEach(([id,q])=>{const f=food(id);if(!f)return;agg[id]=(agg[id]||0)+q*f.f*mult;c+=q*f.f*price(f)*mult}));return c};
  S.profiles.forEach(p=>{if(!S.shop[p.id])return;let c=0;p.week.forEach(id=>{c+=addDay(p.days.find(d=>d.id===id),1)});parts.push([p.eatsHouse?esc(p.name)+' (extras)':esc(p.name),c])});
  const tf=houseFactor();
  if(S.shop.house){let c=0;H().week.forEach(id=>{c+=addDay(hDay(id),tf)});parts.push(['Makla dyal dar (×'+tf+')',c])}
  const cost=parts.reduce((s,x)=>s+x[1],0); const month=cost*30/7; const bud=parseFloat(H().budget);
  const groups=Object.keys(CATS).map(c=>{const ids=Object.keys(agg).filter(id=>food(id)&&food(id).cat===c&&agg[id]>0);if(!ids.length)return '';
    return `<div class="grp">${CATS[c]}</div>`+ids.map(id=>{const f=food(id);const x=agg[id];const done=S.checked[id];
      return `<label class="li ${done?'done':''}"><input type="checkbox" ${done?'checked':''} onchange="chk('${id}',this.checked)"><span class="nm">${esc(f.sn||f.n.replace(/\s*\((nay|tayeb|tayba)[^)]*\)/,''))}</span><span class="amt">${fmtAmt(f,x)}</span><span class="pr">${dh(x*price(f))}</span></label>`}).join('')}).join('');
  return `<div class="stack">
  <section class="panel stack"><div class="sec-h"><h2>Chkoun dakhel f t9edya?</h2></div>
    <div class="chips">
      ${S.profiles.map(p=>`<button class="chip" aria-pressed="${!!S.shop[p.id]}" onclick="S.shop['${p.id}']=!S.shop['${p.id}'];save();render()">${esc(p.name)}</button>`).join('')}
      <button class="chip" aria-pressed="${!!S.shop.house}" onclick="S.shop.house=!S.shop.house;save();render()">Makla dyal dar</button>
    </div>
    <div class="split">${parts.map(([n,c])=>`<div><span>${n}</span><b class="num">${dh(c)}</b></div>`).join('')||'<p class="hint">Khtar chi wa7ed.</p>'}</div>
  </section>
  <section class="stack"><div class="sec-h"><h2>Lista dyal simana</h2><button class="btn sm ghost" onclick="S.checked={};save();render()">Bda men jdid</button></div>
    <p class="hint">Lkmiyat m7soubin b ma katchri: l'9tani w rouz b l'wazn nay, l7out w djaj b l3dem dyalhom. Dowwer 3la lfou9 (sakhra w ghiyab).</p>
    <div class="receipt">${groups||`<div class="empty">Ma kayn walo. 3mmer l'ayyam w l'makla dyal dar.</div>`}
      <div class="tot"><div><span>Simana</span><b>${dh(cost)}</b></div><div><span>Chhar (~30 yom)</span><b>${dh(month)}</b></div>
      ${bud?`<div><span>Budget dyal dar</span><b style="color:${month>bud?'var(--danger)':'var(--p)'}">${month>bud?'+':'−'}${Math.abs(month-bud).toFixed(0)} DH</b></div>`:''}</div>
    </div>
    <div style="max-width:260px"><label class="lbl" for="hBud">Budget dyal dar f chhar (DH)</label><input id="hBud" class="in num" type="number" min="0" value="${H().budget}" onchange="H().budget=this.value;save();render()"></div>
  </section></div>`;
}
function chk(id,v){S.checked[id]=v;save();render()}

/* ---------- Prices ---------- */
function vPrix(){
  const unitL=f=>f.b==='kg'?'DH/kg':f.b==='L'?'DH/L':'DH/'+(f.bl||'7ba');
  return `<div class="stack">
  <div class="warn">Les prix li kaynin m9eddrin. Beddelhom b dyal l'7anout w souk dyalek bach l'7sab ykoun s7i7. Kayt3emlou 3la ga3 les profils.</div>
  <section class="panel"><div class="sec-h"><h2>Prix</h2><button class="btn sm ghost" onclick="S.prices={};save();render();toast('Rje3 les prix l9dam')">Rje3 l les prix l9dam</button></div>
  ${Object.entries(CATS).map(([c,l])=>`<h3 style="font-size:14px;margin-top:14px;color:var(--muted)">${l}</h3><div class="ptable">${allFoods().filter(f=>f.cat===c).map(f=>`
    <div class="prow"><div style="min-width:0"><div style="font-weight:600">${esc(f.n)}</div>${f.nt?`<small>${esc(f.nt)}</small>`:''}</div>
    <div class="pi"><input id="pr_${f.id}" class="in" type="number" step="0.1" min="0" value="${price(f)}" onchange="setP('${f.id}',this.value)"><small>${unitL(f)}</small></div></div>`).join('')}</div>`).join('')}
  </section>
  <section class="panel stack"><h2 style="font-size:19px">Zid makla dyalek</h2>
    <div class="grid">
      <div><label class="lbl" for="cN">Smiya</label><input id="cN" class="in" placeholder="Jben beldi"></div>
      <div><label class="lbl" for="cCat">Categorie</label><select id="cCat" class="in">${Object.entries(CATS).map(([k,l])=>`<option value="${k}">${l}</option>`).join('')}</select></div>
      <div><label class="lbl" for="cU">Kat7seb b</label><select id="cU" class="in"><option value="g">Gram (macros l 100 g, prix l kg)</option><option value="u">7ba (macros w prix l 7ba)</option></select></div>
      <div><label class="lbl" for="cP">Prix (DH)</label><input id="cP" class="in num" type="number" step="0.1" min="0"></div>
    </div>
    <div class="grid">
      <div><label class="lbl" for="cK">kcal</label><input id="cK" class="in num" type="number" min="0"></div>
      <div><label class="lbl" for="cPr">Protein g</label><input id="cPr" class="in num" type="number" step="0.1" min="0"></div>
      <div><label class="lbl" for="cC">Karb g</label><input id="cC" class="in num" type="number" step="0.1" min="0"></div>
      <div><label class="lbl" for="cF">Dhoun g</label><input id="cF" class="in num" type="number" step="0.1" min="0"></div>
    </div>
    <div class="row"><button class="btn pri" onclick="addCustom()">Zid</button><span id="cErr" class="hint" style="color:var(--danger)"></span></div>
  </section>
  <section class="panel stack"><h2 style="font-size:19px">Sauvegarde</h2>
    <p class="hint">Data katsjel ghir f had l'telephone. Bach tdiha l telephone akhor, nsakh l'code w lsa9o temma.</p>
    <div class="row"><button class="btn" onclick="exportData()">Nsakh sauvegarde</button></div>
    <textarea id="impT" class="in num" rows="3" placeholder="Lsa9 sauvegarde hna…"></textarea>
    <div class="row"><button class="btn" onclick="importData()">Importer</button><span id="impMsg" class="hint"></span></div>
  </section></div>`;
}
function setP(id,v){const x=parseFloat(v);if(isNaN(x))delete S.prices[id];else S.prices[id]=Math.max(0,x);save();render()}
function addCustom(){
  const g=id=>document.getElementById(id).value; const n=g('cN').trim(); const u=g('cU');
  const nums=['cP','cK','cPr','cC','cF'].map(i=>parseFloat(g(i)));
  if(!n||nums.some(isNaN)){document.getElementById('cErr').textContent='3mmer smiya w ga3 l\'ar9am.';return}
  const f={id:'c_'+uid(),n,cat:g('cCat'),u,ul:'7ba',d:u==='g'?100:1,s:u==='g'?25:1,m:nums.slice(1),b:u==='g'?'kg':'u',bl:'7ba',f:u==='g'?.001:1,p:nums[0]};
  S.custom.push(f);save();render();toast(n+' tzadet')}
function exportData(){const t=JSON.stringify(S);const el=document.getElementById('impT');
  const ok=()=>toast('Tnsakh');const fb=()=>{el.value=t;el.select();toast('Selectionni w nsakh')};
  try{navigator.clipboard.writeText(t).then(ok,fb)}catch(e){fb()}}
function importData(){try{const o=JSON.parse(document.getElementById('impT').value);if(!o.profiles||!o.profiles.length)throw 0;S=o;normalize();save();curDay=null;curHDay=null;render();toast('Importa mzyan')}catch(e){document.getElementById('impMsg').textContent='Had l\'code machi s7i7.'}}

/* ---------- Toast ---------- */
let tt;function toast(m){const r=document.getElementById('toastRoot');r.innerHTML=`<div class="toast">${esc(m)}</div>`;clearTimeout(tt);tt=setTimeout(()=>r.innerHTML='',1800)}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});

load();render();

/* ---------- PWA ---------- */
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;document.getElementById('installBtn').hidden=false});
function doInstall(){if(!deferredPrompt)return;deferredPrompt.prompt();deferredPrompt.userChoice.finally(()=>{deferredPrompt=null;document.getElementById('installBtn').hidden=true})}
window.addEventListener('appinstalled',()=>{document.getElementById('installBtn').hidden=true;toast('L\'app tinstallat')});
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}

</script>

</body>
</html>
