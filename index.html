<style>
/* Soft UI (neumorphism): surfaces share the page colour and are lifted or pressed with paired light/dark shadows; one deep-teal accent */
:root{
  --bg:#ece5da; --surface:#ece5da; --sunk:#e3dbcf; --line:#d6ccbd;
  --ink:#1f2a2b; --muted:#6e6a62;
  --accent:#0f5257; --accent-ink:#ffffff; --accent-soft:#dfe6e1;
  --money:#8f5f14; --money-soft:#e7dccb;
  --p:#2c7a5c; --c:#b07f12; --f:#b2474f; --kcal:#bf5f26;
  --danger:#b2363f;
  --hi:rgba(255,255,255,.85); --lo:rgba(163,146,120,.55);
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r:18px;
  color-scheme: only light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#252a2c; --surface:#252a2c; --sunk:#1f2325; --line:#343a3d;
  --ink:#e9e6df; --muted:#a19d94;
  --accent:#5fb8b2; --accent-ink:#10292a; --accent-soft:#2c3537;
  --money:#e2b25a; --money-soft:#2e2b24;
  --p:#5fc79a; --c:#e0b448; --f:#ec7a82; --kcal:#ee9356; --danger:#ef7b82;
  --hi:rgba(255,255,255,.06); --lo:rgba(0,0,0,.55);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#252a2c; --surface:#252a2c; --sunk:#1f2325; --line:#343a3d;
  --ink:#e9e6df; --muted:#a19d94;
  --accent:#5fb8b2; --accent-ink:#10292a; --accent-soft:#2c3537;
  --money:#e2b25a; --money-soft:#2e2b24;
  --p:#5fc79a; --c:#e0b448; --f:#ec7a82; --kcal:#ee9356; --danger:#ef7b82;
  --hi:rgba(255,255,255,.06); --lo:rgba(0,0,0,.55);
  color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;padding-top:env(safe-area-inset-top,0px)}
#installBtn[hidden]{display:none}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 80px}
.wrap{max-width:960px;margin:0 auto}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:18px 10px}
.brand h1{font-size:26px;font-weight:800;letter-spacing:-.02em}
.brand p{margin:0;color:var(--muted);font-size:13px}
.who{display:flex;align-items:center;gap:8px}
.who select{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-weight:600}

nav.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:999px;margin-block:6px 18px;overflow-x:auto;
  position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
nav.tabs button{flex:1;white-space:nowrap;border:0;background:transparent;padding:9px 14px;border-radius:999px;font-weight:600;color:var(--muted)}
nav.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.grid.wide{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.lbl{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px;letter-spacing:.02em}
.in{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.in:focus{border-color:var(--accent);outline:none}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec-h h2{font-size:19px}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 13px;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:5px 10px;font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:600;font-size:13.5px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.target{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tbox{background:var(--sunk);border-radius:10px;padding:10px}
.tbox b{display:block;font-family:var(--mono);font-size:20px}
.tbox span{font-size:12px;color:var(--muted)}
@media (max-width:520px){.target{grid-template-columns:repeat(2,1fr)}}

.bars{position:sticky;top:calc(env(safe-area-inset-top,0px) + 56px);z-index:15;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;grid-template-columns:1fr 1fr;gap:8px 18px}
.bar .t{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600}
.bar .t .num{font-size:12.5px}
.track{height:6px;background:var(--sunk);border-radius:6px;overflow:hidden;margin-top:4px}
.fill{height:100%;border-radius:6px}
.over .t .num{color:var(--danger)}
.bars .cost{grid-column:1/-1;display:flex;justify-content:space-between;border-top:1px dashed var(--line);padding-top:8px;font-size:13px}
.bars .cost b{color:var(--money)}

.meal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.meal-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.meal-h h3{font-size:16px}
.meal-h .m{font-size:12.5px;color:var(--muted)}
.items{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--sunk)}
.item:last-child{border-bottom:0}
.item .nm{font-weight:600;min-width:0}
.item .mm{font-size:12px;color:var(--muted)}
.mm .p{color:var(--p)} .mm .c{color:var(--c)} .mm .f{color:var(--f)} .mm .k{color:var(--kcal)}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.qty button{border:0;background:var(--sunk);width:30px;height:32px;font-weight:700}
.qty input{width:56px;border:0;text-align:center;background:transparent;height:32px;font-family:var(--mono)}
.qty small{padding-right:8px;color:var(--muted);font-size:11.5px;white-space:nowrap}
.price{font-family:var(--mono);font-size:13px;color:var(--money);text-align:right;min-width:62px}
.x{border:0;background:transparent;color:var(--muted);width:26px;height:26px;border-radius:6px}
.x:hover{color:var(--danger);background:var(--sunk)}
.empty{padding:16px 14px;color:var(--muted);font-size:13.5px}
@media (max-width:560px){.item{grid-template-columns:1fr auto}.item .price{grid-column:1;text-align:left}.item .x{grid-row:1;grid-column:2;justify-self:end}}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{background:var(--sunk);border-radius:10px;padding:8px}
.wd b{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.wd select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 4px;font-size:13px}
@media (max-width:700px){.week{grid-template-columns:repeat(2,1fr)}}

.receipt{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.receipt .grp{padding:8px 14px;background:var(--sunk);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.li{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--sunk)}
.li input{width:18px;height:18px;accent-color:var(--accent)}
.li.done .nm{text-decoration:line-through;color:var(--muted)}
.li .amt{font-family:var(--mono);font-weight:600}
.li .pr{font-family:var(--mono);color:var(--money);min-width:70px;text-align:right}
.tot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:14px;background:var(--money-soft)}
.tot div span{display:block;font-size:12px;color:var(--muted)}
.tot div b{font-family:var(--mono);font-size:20px;color:var(--money)}

.ptable{display:flex;flex-direction:column}
.prow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--sunk)}
.prow .pi{display:flex;align-items:center;gap:6px}
.prow .pi input{width:84px;text-align:right;font-family:var(--mono)}
.prow small{color:var(--muted);font-size:12px;white-space:nowrap}

.note{background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:13.5px}
.warn{background:var(--money-soft);border-radius:10px;padding:10px 12px;font-size:13.5px}

.sheet-bg{position:fixed;inset:0;background:rgba(10,14,30,.45);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:18px 18px 0 0;max-height:82%;display:flex;flex-direction:column;
  padding:14px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-width:760px;margin:0 auto}
.sheet .list{overflow-y:auto;margin-top:10px;display:flex;flex-direction:column}
.fopt{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;text-align:left;border:0;border-bottom:1px solid var(--sunk);background:transparent;padding:10px 4px}
.fopt:hover{background:var(--sunk)}
.fopt .nm{font-weight:600}
.fopt .add{font-weight:700;color:var(--accent);font-size:20px;padding:0 8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13.5px;font-weight:600;z-index:60}
@media (prefers-reduced-motion:no-preference){.fill{transition:width .25s}}

/* ---- Soft UI layer ---- */
:root{--raise:6px 6px 14px var(--lo),-6px -6px 14px var(--hi);--raise-sm:3px 3px 7px var(--lo),-3px -3px 7px var(--hi);
  --press:inset 3px 3px 7px var(--lo),inset -3px -3px 7px var(--hi)}
.panel,.meal,.bars,.receipt{border:0;box-shadow:var(--raise);border-radius:var(--r)}
.meal-h{border-bottom:1px solid var(--line)}
.item,.li,.fopt,.prow{border-bottom-color:var(--line)}
.in,.who select,.wd select{border:0;background:var(--bg);box-shadow:var(--press);border-radius:12px}
.in:focus,.who select:focus{box-shadow:var(--press),0 0 0 2px var(--accent)}
nav.tabs{background:var(--bg);box-shadow:var(--press);padding:6px}
nav.tabs button[aria-selected="true"]{background:var(--bg);color:var(--accent);box-shadow:var(--raise-sm)}
.btn{border:0;background:var(--bg);box-shadow:var(--raise-sm);border-radius:12px;color:var(--ink)}
.btn:hover{border:0;color:var(--accent)}
.btn:active,.chip:active,.qty button:active{box-shadow:var(--press)}
.btn.pri{background:var(--accent);color:var(--accent-ink);box-shadow:var(--raise-sm)}
.btn.pri:hover{color:var(--accent-ink);filter:brightness(1.08)}
.btn.ghost{box-shadow:none;background:transparent}
.btn.danger{color:var(--danger)}
.chip{border:0;background:var(--bg);box-shadow:var(--raise-sm)}
.chip[aria-pressed="true"]{background:var(--bg);color:var(--accent);box-shadow:var(--press);border:0}
.tbox{background:var(--bg);box-shadow:var(--press);border-radius:14px}
.track{background:var(--bg);box-shadow:inset 2px 2px 4px var(--lo),inset -2px -2px 4px var(--hi);height:8px}
.qty{border:0;box-shadow:var(--press);border-radius:12px;background:var(--bg);width:max-content}
.qty button{background:transparent;color:var(--accent)}
.wd{background:var(--bg);box-shadow:var(--raise-sm);border-radius:14px}
.receipt .grp{background:var(--sunk)}
.tot{background:var(--sunk)}
.note,.warn{background:var(--bg);box-shadow:var(--press);border-radius:14px}
.note{border-left:3px solid var(--accent)}
.warn{border-left:3px solid var(--money)}
.sheet{background:var(--bg);box-shadow:0 -8px 24px var(--lo)}
.toast{background:var(--accent);color:var(--accent-ink);box-shadow:var(--raise-sm)}
.x:hover{background:var(--bg);box-shadow:var(--press)}
.brand h1{color:var(--accent)}

.mems{display:flex;flex-direction:column;gap:10px}
.mem{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;padding:10px;border-radius:14px;background:var(--bg);box-shadow:var(--raise-sm)}
.mem-n{display:flex;gap:8px;align-items:center;flex:1;min-width:0}
.mem-n input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.mem-n small{display:block;color:var(--muted);font-size:12px}
.mem-f{width:86px}
.mem .x{align-self:center}
.split{display:flex;flex-direction:column;gap:6px}
.split div{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.split b{color:var(--money)}
nav.tabs button{padding:9px 10px}

.themesw{display:flex;background:var(--bg);box-shadow:var(--press);border-radius:999px;padding:4px;gap:2px}
.themesw button{border:0;background:transparent;border-radius:999px;padding:5px 11px;font-weight:700;font-size:13px;color:var(--muted)}
.themesw button[aria-checked="true"]{background:var(--bg);color:var(--accent);box-shadow:var(--raise-sm)}
.who{flex-wrap:wrap}

/* ---- Languages / RTL ---- */
.ctrls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.langsel{border:0;background:var(--bg);box-shadow:var(--raise-sm);border-radius:999px;padding:7px 12px;font-weight:600}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
html[dir=rtl] body,html[dir=rtl] button,html[dir=rtl] input,html[dir=rtl] select,html[dir=rtl] textarea{font-family:"IBM Plex Sans Arabic","Noto Sans Arabic",var(--body)}
html[dir=rtl] h2,html[dir=rtl] h3{font-family:"IBM Plex Sans Arabic","Noto Sans Arabic",var(--display);font-weight:700}
html[dir=rtl] .num{font-family:"IBM Plex Sans Arabic","Noto Sans Arabic",sans-serif;font-variant-numeric:tabular-nums}
.note{border-left:0;border-inline-start:3px solid var(--accent)}
.warn{border-left:0;border-inline-start:3px solid var(--money)}
.price,.li .pr{text-align:end}
.fopt{text-align:start}
bdi{unicode-bidi:isolate}
.qty input{direction:ltr}

.li{grid-template-columns:auto 1fr auto auto auto}
.li .nm{cursor:pointer;min-width:0}
.li .need{display:block;font-size:11.5px;color:var(--muted);font-weight:400}
.home-btn{border:0;background:var(--bg);box-shadow:var(--raise-sm);border-radius:10px;width:32px;height:32px;font-size:16px;color:var(--muted)}
.home-btn[aria-pressed="true"]{box-shadow:var(--press);color:var(--accent)}
.grp-hint{padding:4px 14px 8px;font-size:12px;color:var(--muted);background:var(--sunk)}
a.btn{text-decoration:none;display:inline-flex;align-items:center}
.btn:disabled{opacity:.4}
@media (max-width:480px){.li{grid-template-columns:auto 1fr auto auto;row-gap:2px}.li .pr{grid-column:2/4;grid-row:2;text-align:start;font-size:12px}.li .home-btn{grid-column:4;grid-row:1/3}}
</style>
</head>

/* ---------- Maths ---------- */
const LIM={w:[35,250],h:[120,230],age:[14,90],fatPct:[20,40],protKg:[1,3.3],hf:[0,2]};
const clamp=(k,v,def)=>{v=+v;if(!isFinite(v)||v<=0)return def;return Math.min(LIM[k][1],Math.max(LIM[k][0],v))};
/* Targets.
 - Energy: Mifflin-St Jeor BMR × activity × goal factor, with a floor (1200 kcal women, 1500 men) for deficits.
 - Under 18: no deficit (Mifflin is not validated for adolescents; cutting needs medical follow-up).
 - Protein: g/kg of a reference weight = actual weight, capped at the weight for BMI 25, because protein
   needs track lean mass, not fat mass.
 - Fat: % of calories (default 27%), never below 0.6 g/kg of reference weight. Carbs fill the rest. */
function targets(p){
  const w=clamp('w',p.w,70), h=clamp('h',p.h,170), age=clamp('age',p.age,30);
  const bmr=10*w+6.25*h-5*age+(p.sex==='m'?5:-161);
  const tdee=bmr*p.act; const minor=age<18;
  const goal=(minor&&GOALS[p.goal][0]<1)?'maintain':p.goal;
  let kcal=Math.round(tdee*GOALS[goal][0]); let floored=false;
  const floor=p.sex==='f'?1200:1500;
  if(GOALS[goal][0]<1&&kcal<floor){const k2=Math.min(floor,Math.round(tdee));floored=k2>kcal;kcal=k2;}
  const hm=h/100, bmi=w/(hm*hm), refW=bmi>25?25*hm*hm:w;
  const pk=p.protKg?clamp('protKg',p.protKg,GOALS[goal][1]):GOALS[goal][1]; const prot=Math.round(refW*pk);
  const fatPct=clamp('fatPct',p.fatPct,27);
  const fat=Math.max(Math.round(kcal*fatPct/100/9),Math.round(refW*.6));
  const carbs=Math.max(0,Math.round((kcal-prot*4-fat*9)/4));
  return {bmr:Math.round(bmr),tdee:Math.round(tdee),kcal,prot,fat,carbs,pk,refW:Math.round(refW),bmi:r1(bmi),usesRef:bmi>25,floored,minor,goal};
}
/* Average personal kcal per filled day: used to warn about counting a person's food twice */
function personalAvg(p){let n=0,k=0;p.week.forEach(id=>{const d=p.days.find(x=>x.id===id);if(d){const v=dayTot(d).k;if(v>0){n++;k+=v}}});return n?k/n:0}
function doubleWarn(p){if(!p.eatsHouse)return '';const a=personalAvg(p);return a>targets(p).kcal*.5?`<div class="warn">${t('double_warn',{n:esc(p.name),k:bdi(r0(a))})}</div>`:''}
function itemM(fid,q){
  const f=food(fid); if(!f) return {k:0,p:0,c:0,f:0,cost:0};
  const mul=f.u==='g'?q/100:q;
  return {k:f.m[0]*mul,p:f.m[1]*mul,c:f.m[2]*mul,f:f.m[3]*mul,cost:q*f.f*price(f)};
}
function sum(list){const tt={k:0,p:0,c:0,f:0,cost:0};list.forEach(([id,q])=>{const m=itemM(id,q);for(const k in tt)tt[k]+=m[k]});return tt;}
const dayTot=d=>d?sum(mealKeys().flatMap(k=>d.meals[k]||[])):{k:0,p:0,c:0,f:0,cost:0};
const addT=(a,b,x=1)=>{const o={};for(const k in a)o[k]=a[k]+b[k]*x;return o;};

/* ---------- Shopping (whole household) ---------- */
/* Amount in buy units -> [number, unit]; kg/L round up to 0.1 above 1, to 10 g/ml below */
function amtParts(f,x){
  if(f.b==='kg') return x>=1?[Math.ceil(x*10-1e-9)/10,t('u_kg')]:[Math.ceil(x*100-1e-9)*10,t('u_g')];
  if(f.b==='L') return x>=1?[Math.ceil(x*10-1e-9)/10,t('u_L')]:[Math.ceil(x*100-1e-9)*10,t('u_ml')];
  return [Math.ceil(x-1e-9),unitName(f.bl||'7ba')];
}
const fmtAmt=(f,x)=>{const [n,u]=amtParts(f,x);return nu(n,esc(u))};
const txtAmt=(f,x)=>amtParts(f,x).join(' ');
/* What you actually take home: whole packs for packaged goods, whole units for counted items */
function buyQty(f,x){const p=PACK[f.id];if(p)return Math.ceil(x/p-1e-9)*p;if(f.b==='u')return Math.ceil(x-1e-9);return x}
let showPantry=false;
function shopData(){
  const agg={}; const parts=[];
  const add=(id,amt)=>{agg[id]=(agg[id]||0)+amt};
  const addDay=(d,mult)=>{let c=0;if(!d)return 0;mealKeys().forEach(k=>(d.meals[k]||[]).forEach(([id,q])=>{const f=food(id);if(!f)return;
    if(f.isRec){const r=recipe(id);const n=Math.max(1,+r.servings||1);r.items.forEach(([iid,iq])=>{const g=food(iid);if(g)add(iid,iq*(q/n)*g.f*mult)})}
    else add(id,q*f.f*mult);
    c+=q*f.f*price(f)*mult}));return c};
  S.profiles.forEach(p=>{if(!S.shop[p.id])return;let c=0;p.week.forEach(id=>{c+=addDay(p.days.find(d=>d.id===id),1)});parts.push([esc(p.name)+(p.eatsHouse?t('extras'):''),c])});
  const tf=houseFactor();
  if(S.shop.house){let c=0;H().week.forEach(id=>{c+=addDay(hDay(id),tf)});parts.push([t('house_food')+' (×'+tf+')',c])}
  const rows=Object.keys(agg).filter(id=>food(id)&&agg[id]>0).map(id=>{const f=food(id);const monthly=STAPLE.has(id);
    const need=monthly?agg[id]*30/7:agg[id];const buy=buyQty(f,need);return {id,f,monthly,need,buy,cost:buy*price(f),home:!!S.pantry[id],done:!!S.checked[id]}})
    .sort((a,b)=>CAT_KEYS.indexOf(a.f.cat)-CAT_KEYS.indexOf(b.f.cat));
  const cost=parts.reduce((s,x)=>s+x[1],0);
  return {rows,parts,cost};
}
/* Shorter names on the list: built-in foods drop their bracketed detail (raw/cooked, portion size) */
const shopName=f=>f.sn?t('sugar'):(f.n!=null?f.n:fname(f).replace(/\s*\([^)]*\)\s*$/,''));
function shopText(rows){
  const d=new Date().toLocaleDateString(lang()==='en'?'en-GB':'fr-FR');
  const sec=(m,title)=>{const r=rows.filter(x=>x.monthly===m&&!x.home&&!x.done);return r.length?`\n*${title}*\n`+r.map(x=>`- ${shopName(x.f)}: ${txtAmt(x.f,x.buy)}`).join('\n')+'\n':''};
  const trip=rows.filter(x=>!x.home&&!x.done).reduce((s,x)=>s+x.cost,0);
  return `🛒 ${t('list_title')} · ${d}\n`+sec(false,t('weekly_items'))+sec(true,t('monthly_items'))+`\n${t('this_trip')} ≈ ${trip.toFixed(0)} ${t('dh')}`;
}
function vT9edya(){
  const {rows,parts,cost}=shopData(); const month=cost*30/7; const bud=parseFloat(H().budget);
  const visible=rows.filter(x=>!x.home), home=rows.filter(x=>x.home);
  const trip=visible.filter(x=>!x.done).reduce((s,x)=>s+x.cost,0);
  const row=x=>{const differs=Math.abs(x.buy-x.need)>1e-6&&x.f.b!=='u';
    return `<div class="li ${x.done?'done':''}"><input type="checkbox" id="ck_${x.id}" ${x.done?'checked':''} onchange="chk('${x.id}',this.checked)">
      <label class="nm" for="ck_${x.id}">${esc(shopName(x.f))}${differs?`<small class="need">${t('need',{x:fmtAmt(x.f,x.need)})}</small>`:''}</label>
      <span class="amt">${fmtAmt(x.f,x.buy)}</span><span class="pr">${dh(x.cost)}</span>
      <button class="home-btn" aria-pressed="${x.home}" title="${t('have_home')}" aria-label="${t('have_home')}: ${esc(shopName(x.f))}" onclick="pantry('${x.id}')">⌂</button></div>`};
  const section=(m,title,hint)=>{const r=visible.filter(x=>x.monthly===m);return r.length?`<div class="grp">${title}</div>${hint?`<div class="grp-hint">${hint}</div>`:''}`+r.map(row).join(''):''};
  const txt=shopText(rows);
  return `<div class="stack">
  <section class="panel stack"><div class="sec-h"><h2>${t('who_in')}</h2></div>
    <div class="chips">
      ${S.profiles.map(p=>`<button class="chip" aria-pressed="${!!S.shop[p.id]}" onclick="S.shop['${p.id}']=!S.shop['${p.id}'];save();render()">${esc(p.name)}</button>`).join('')}
      <button class="chip" aria-pressed="${!!S.shop.house}" onclick="S.shop.house=!S.shop.house;save();render()">${t('house_food')}</button>
    </div>
    <div class="split">${parts.map(([n,c])=>`<div><span>${n}</span><b>${dh(c)}</b></div>`).join('')||`<p class="hint">${t('pick_someone')}</p>`}</div>
  </section>
  <section class="stack"><div class="sec-h"><h2>${t('week_list')}</h2><button class="btn sm ghost" onclick="S.checked={};save();render()">${t('restart')}</button></div>
    <p class="hint">${t('list_hint')}</p>
    <div class="receipt">${rows.length?section(false,t('weekly_items'))+section(true,t('monthly_items'),t('monthly_hint')):`<div class="empty">${t('list_empty')}</div>`}
      ${home.length?`<div class="grp row" style="justify-content:space-between"><span>⌂ ${t('at_home',{n:home.length})}</span><button class="btn sm ghost" onclick="showPantry=!showPantry;render()">${showPantry?t('hide'):t('show')}</button></div>${showPantry?home.map(row).join(''):''}`:''}
      <div class="tot"><div><span>${t('this_trip')}</span><b>${dh(trip)}</b></div><div><span>${t('week')}</span><b>${dh(cost)}</b></div><div><span>${t('month')}</span><b>${dh(month)}</b></div>
      ${bud?`<div><span>${t('house_budget')}</span><b style="color:${month>bud?'var(--danger)':'var(--p)'}">${bdi((month>bud?'+':'−')+Math.abs(month-bud).toFixed(0)+' '+t('dh'))}</b></div>`:''}</div>
    </div>
    ${rows.length?`<div class="row"><a class="btn pri" href="https://wa.me/?text=${encodeURIComponent(txt)}" target="_blank" rel="noopener">${t('share_wa')}</a><button class="btn" onclick="copyList()">${t('copy_list')}</button></div>`:''}
    <div style="max-width:260px"><label class="lbl" for="hBud">${t('house_budget_in')}</label><input id="hBud" class="in num" type="number" min="0" value="${H().budget}" onchange="H().budget=this.value;save();render()"></div>
  </section></div>`;
}
function pantry(id){if(S.pantry[id])delete S.pantry[id];else S.pantry[id]=true;save();render()}
function copyList(){const txt=shopText(shopData().rows);try{navigator.clipboard.writeText(txt).then(()=>toast(t('toast_copied')),()=>toast(txt.slice(0,60)))}catch(e){}}
function chk(id,v){S.checked[id]=v;save();render()}

/* ---------- Prices ---------- */
function vPrix(){
  const unitL=f=>t('dh')+'/'+(f.b==='kg'?t('u_kg'):f.b==='L'?t('u_L'):unitName(f.bl||'7ba'));
  return `<div class="stack">
  <div class="warn">${t('price_warn')}</div>
  <section class="panel"><div class="sec-h"><h2>${t('prices')}</h2><button class="btn sm ghost" onclick="S.prices={};save();render();toast(t('toast_reset'))">${t('reset_prices')}</button></div>
  ${CAT_KEYS.map(c=>`<h3 style="font-size:14px;margin-top:14px;color:var(--muted)">${catName(c)}</h3><div class="ptable">${allFoods().filter(f=>f.cat===c).map(f=>`
    <div class="prow"><div style="min-width:0"><div style="font-weight:600">${esc(fname(f))}</div>${f.nt?`<small>${esc(noteOf(f))}</small>`:''}</div>
    <div class="pi"><input id="pr_${f.id}" class="in" type="number" step="0.1" min="0" value="${price(f)}" onchange="setP('${f.id}',this.value)"><small>${esc(unitL(f))}</small></div></div>`).join('')}</div>`).join('')}
  </section>
  ${S.custom.length?`<section class="panel stack"><h2 style="font-size:19px">${t('custom_list')}</h2>
    <div class="ptable">${S.custom.map(f=>`<div class="prow"><div style="min-width:0"><div style="font-weight:600">${esc(f.n)}</div><small>${catName(f.cat)} · ${macro({k:f.m[0],p:f.m[1],c:f.m[2],f:f.m[3]})}</small></div>
      <div class="row"><button class="btn sm" onclick="editCustom('${f.id}')">${t('edit')}</button><button class="btn sm danger" onclick="delCustom('${f.id}')">${delArm==='c_'+f.id?t('confirm_del'):t('del')}</button></div></div>`).join('')}</div></section>`:''}
  <section class="panel stack" id="customForm"><h2 style="font-size:19px">${editingCustom?t('edit')+' · '+esc((food(editingCustom)||{}).n||''):t('add_custom')}</h2>
    <div class="grid">
      <div><label class="lbl" for="cN">${t('name')}</label><input id="cN" class="in" placeholder="${t('custom_ph')}"></div>
      <div><label class="lbl" for="cCat">${t('category')}</label><select id="cCat" class="in">${CAT_KEYS.map(k=>`<option value="${k}">${catName(k)}</option>`).join('')}</select></div>
      <div><label class="lbl" for="cU">${t('calc_by')}</label><select id="cU" class="in"><option value="g">${t('by_gram')}</option><option value="u">${t('by_unit')}</option></select></div>
      <div><label class="lbl" for="cP">${t('price_dh')}</label><input id="cP" class="in num" type="number" step="0.1" min="0"></div>
    </div>
    <div class="grid">
      <div><label class="lbl" for="cK">${t('kcal_u')}</label><input id="cK" class="in num" type="number" min="0"></div>
      <div><label class="lbl" for="cPr">${t('prot_g')}</label><input id="cPr" class="in num" type="number" step="0.1" min="0"></div>
      <div><label class="lbl" for="cC">${t('carbs_g')}</label><input id="cC" class="in num" type="number" step="0.1" min="0"></div>
      <div><label class="lbl" for="cF">${t('fat_g')}</label><input id="cF" class="in num" type="number" step="0.1" min="0"></div>
    </div>
    <div class="row"><button class="btn pri" onclick="addCustom()">${editingCustom?t('save'):t('add')}</button>${editingCustom?`<button class="btn" onclick="editingCustom=null;render()">${t('cancel')}</button>`:''}<span id="cErr" class="hint" style="color:var(--danger)"></span></div>
  </section>
  <section class="panel stack"><h2 style="font-size:19px">${t('backup')}</h2>
    <p class="hint">${t('backup_hint')}</p>
    <p class="hint"><b>${S.lastBackup?t('last_backup',{d:bdi(new Date(S.lastBackup).toLocaleDateString(lang()==='en'?'en-GB':'fr-FR'))}):t('never_backup')}</b></p>
    <div class="row"><button class="btn pri" onclick="exportFile()">${t('export_file')}</button>
      <label class="btn" for="impF" style="cursor:pointer">${t('import_file')}</label><input id="impF" type="file" accept="application/json,.json" hidden onchange="importFile(this)">
      <button class="btn" onclick="exportData()">${t('copy_backup')}</button></div>
    <textarea id="impT" class="in num" rows="3" placeholder="${t('paste_ph')}"></textarea>
    <div class="row"><button class="btn" onclick="importData()">${t('import')}</button><span id="impMsg" class="hint"></span></div>
    <div class="row" style="border-top:1px solid var(--line);padding-top:12px"><button class="btn danger" onclick="resetAll()">${delArm==='all'?t('reset_confirm'):t('reset_all')}</button></div>
  </section></div>`;
}
function setP(id,v){const x=parseFloat(v);if(isNaN(x))delete S.prices[id];else S.prices[id]=Math.max(0,x);save();render()}
let editingCustom=null;
function addCustom(){
  const g=id=>document.getElementById(id).value; const n=g('cN').trim(); const u=g('cU');
  const nums=['cP','cK','cPr','cC','cF'].map(i=>parseFloat(g(i)));
  if(!n||nums.some(x=>isNaN(x)||x<0)){document.getElementById('cErr').textContent=t('custom_err');return}
  const fields={n,cat:g('cCat'),u,ul:'7ba',d:u==='g'?100:1,s:u==='g'?25:1,m:nums.slice(1),b:u==='g'?'kg':'u',bl:'7ba',f:u==='g'?.001:1,p:nums[0]};
  if(editingCustom){const f=food(editingCustom);
    if(f.u!==u){/* unit changed: convert stored quantities so the meals keep a sensible size */
      const conv=q=>u==='g'?q*100:Math.max(1,r1(q/100));
      eachItem((it)=>{if(it[0]===f.id)it[1]=conv(it[1])});}
    Object.assign(f,fields);delete S.prices[f.id];editingCustom=null;save();render();toast(t('toast_saved'));return}
  S.custom.push(Object.assign({id:'c_'+uid()},fields));save();render();toast(t('toast_custom',{n}))}
function eachItem(fn){eachList(arr=>arr.forEach((it,i)=>fn(it,i,arr)))}
function editCustom(id){editingCustom=id;render();const f=food(id);
  const set=(i,v)=>{const el=document.getElementById(i);if(el)el.value=v};
  set('cN',f.n);set('cCat',f.cat);set('cU',f.u);set('cP',price(f));set('cK',f.m[0]);set('cPr',f.m[1]);set('cC',f.m[2]);set('cF',f.m[3]);
  const el=document.getElementById('customForm');if(el)el.scrollIntoView({behavior:'smooth',block:'start'})}
function delCustom(id){if(delArm!=='c_'+id){delArm='c_'+id;render();return}
  S.custom=S.custom.filter(f=>f.id!==id);delete S.prices[id];delete S.checked[id];
  eachList(arr=>{for(let i=arr.length-1;i>=0;i--)if(arr[i][0]===id)arr.splice(i,1)});
  if(editingCustom===id)editingCustom=null;delArm=null;save();render();toast(t('toast_deleted'))}
function resetAll(){if(delArm!=='all'){delArm='all';render();return}
  const keep={lang:S.lang,theme:S.theme};try{localStorage.removeItem(KEY)}catch(e){}
  load();Object.assign(S,keep);save();delArm=null;curDay=null;curHDay=null;tab='profil';render();toast(t('toast_reset_all'))}
function backupNag(){const old=!S.lastBackup||(Date.now()-S.lastBackup>30*864e5);
  return old?`<div class="warn row" style="justify-content:space-between"><span>${S.lastBackup?t('backup_old'):t('never_backup')}</span><button class="btn sm" onclick="go('prix');setTimeout(()=>{const e=document.getElementById('impF');e&&e.closest('section').scrollIntoView({behavior:'smooth'})},50)">${t('go_backup')}</button></div>`:''}
function exportFile(){
  S.lastBackup=Date.now();save();
  const s=JSON.stringify(S,null,1); const d=new Date().toISOString().slice(0,10);
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:'application/json'}));a.download='makla-mizan-'+d+'.json';
    document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
    render();toast(t('toast_saved'))}catch(e){exportData()}}
function importFile(inp){const f=inp.files&&inp.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{document.getElementById('impT').value=r.result;importData()};r.readAsText(f)}
function exportData(){S.lastBackup=Date.now();save();const s=JSON.stringify(S);const el=document.getElementById('impT');
  const ok=()=>toast(t('toast_copied'));const fb=()=>{el.value=s;el.select();toast(t('toast_select'))};
  try{navigator.clipboard.writeText(s).then(ok,fb)}catch(e){fb()}}
function importData(){try{const o=JSON.parse(document.getElementById('impT').value);if(!o.profiles||!o.profiles.length)throw 0;S=o;normalize();save();applyTheme();curDay=null;curHDay=null;render();toast(t('toast_import'))}catch(e){document.getElementById('impMsg').textContent=t('import_err')}}

/* ---------- Toast ---------- */
let tt;function toast(m){const r=document.getElementById('toastRoot');r.innerHTML=`<div class="toast">${esc(m)}</div>`;clearTimeout(tt);tt=setTimeout(()=>r.innerHTML='',1800)}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});

/* ---------- Theme: light / dark / follow phone ---------- */
function applyTheme(){
  const th=(S&&S.theme)||'auto'; const root=document.documentElement;
  if(th==='auto') root.removeAttribute('data-theme'); else root.setAttribute('data-theme',th);
  document.querySelectorAll('#themeSw button').forEach(b=>b.setAttribute('aria-checked',String(b.dataset.t===th)));
  const dark=th==='dark'||(th==='auto'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);
  const m=document.querySelector('meta[name="theme-color"]'); if(m) m.setAttribute('content',dark?'#252a2c':'#ece5da');
}
function setTheme(th){S.theme=th;save();applyTheme()}
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme)}catch(e){}

load();render();applyTheme();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persisted().then(ok=>{if(!ok)navigator.storage.persist()})}catch(e){}

/* ---------- PWA ---------- */
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;document.getElementById('installBtn').hidden=false});
function doInstall(){if(!deferredPrompt)return;deferredPrompt.prompt();deferredPrompt.userChoice.finally(()=>{deferredPrompt=null;document.getElementById('installBtn').hidden=true})}
window.addEventListener('appinstalled',()=>{document.getElementById('installBtn').hidden=true;toast(t('toast_installed'))});
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}

</script>

</body>
